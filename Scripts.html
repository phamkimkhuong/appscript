  function getStoredLang() {
    try {
      if (typeof localStorage !== 'undefined' && localStorage.getItem) {
        const saved = localStorage.getItem('wanzhong_lang') || localStorage.getItem('vintech_lang');
        if (saved && ['vi', 'en', 'zh'].includes(saved)) return saved;
      }
    } catch (e) { }
    return 'vi';
  }

  function setStoredLang(lang) {
    try {
      if (typeof localStorage !== 'undefined' && localStorage.setItem) {
        localStorage.setItem('wanzhong_lang', lang);
      }
    } catch (e) { }
  }

  let currentLang = getStoredLang();

  function t(key, params) {
    if (!key) return '';
    const lang = (typeof currentLang !== 'undefined' ? currentLang : 'vi') || 'vi';
    let str = (I18N[lang] && I18N[lang][key] !== undefined)
      ? I18N[lang][key]
      : ((I18N['vi'] && I18N['vi'][key] !== undefined) ? I18N['vi'][key] : key);

    if (str === key && typeof key === 'string') {
      let m;
      if ((m = /^Đã duyệt đơn (.*?) thành công!?$/.exec(key))) return t('MSG_LEAVE_APPROVED', { id: m[1] });
      if ((m = /^Đã từ chối đơn (.*?)!?$/.exec(key))) return t('MSG_LEAVE_REJECTED', { id: m[1] });
      if ((m = /^Đã xác nhận hồ sơ BHXH (.*?) thành công!?$/.exec(key))) return t('MSG_SICK_APPROVED', { id: m[1] });
      if ((m = /^Đã chuyển trạng thái nhân viên (.*?) sang Đã nghỉ việc!?$/.exec(key))) return t('MSG_EMP_RESIGNED', { id: m[1] });
      if ((m = /^Đăng nhập thành công! Xin chào (.*?)\.?$/.exec(key))) return t('MSG_LOGIN_SUCCESS', { name: m[1] });
      if ((m = /^Đã lưu thành công (\d+) thay đổi trên bảng chấm công.*$/.exec(key))) return t('MSG_TS_SAVED_BATCH', { count: m[1] });
    }

    if (params && typeof params === 'object' && Object.keys(params).length > 0) {
      Object.keys(params).forEach(k => {
        str = str.replace(new RegExp(`\\{${k}\\}`, 'g'), params[k]);
      });
    }

    return str;
  }

  function translateToast(msg) {
    return t(msg);
  }

  function applyStaticI18n() {
    if (typeof document === 'undefined') return;
    if (document.querySelectorAll) {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (key && I18N[currentLang] && I18N[currentLang][key]) {
          el.innerText = I18N[currentLang][key];
        }
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (key && I18N[currentLang] && I18N[currentLang][key]) {
          el.placeholder = I18N[currentLang][key];
        }
      });
      document.querySelectorAll('[data-i18n-title]').forEach(el => {
        const key = el.getAttribute('data-i18n-title');
        if (key && I18N[currentLang] && I18N[currentLang][key]) {
          el.title = I18N[currentLang][key];
        }
      });
    }
  }

  function changeLanguage(lang) {
    if (!['vi', 'en', 'zh'].includes(lang)) lang = 'vi';
    currentLang = lang;
    setStoredLang(lang);
    const loginSel = document.getElementById('login-lang-select');
    if (loginSel) loginSel.value = lang;
    const appSel = document.getElementById('app-lang-select');
    if (appSel) appSel.value = lang;
    applyStaticI18n();
    if (currentUser) {
      document.getElementById('greet-badge').innerText = currentUser.role === 'employee' ? t('role_employee', 'Nhân Viên') : currentUser.role === 'manager' ? t('role_manager', 'Quản Lý / Trưởng Phòng') : t('role_hr', 'Kế Toán');

  // --- XSS SANITIZER HELPER ---
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // --- CALL BACKEND BRIDGE ---
  function callBackend(fnName, args, callback, errorCallback) {
    const generation = authGeneration;
    const mutating = !['apiLogin', 'apiGetInitialAppData', 'apiGetAttendance', 'apiGetPayrollData', 'apiReadAttachment'].includes(fnName);
    if (mutating && busyActions.has(fnName)) { showToast('Thao tác đang được xử lý.', 'info'); return; }
    if (mutating) busyActions.add(fnName);
    const done = res => {
      if (generation !== authGeneration) return;
      busyActions.delete(fnName);
      if (fnName === 'apiLogin' && res && res.success) {
        authToken = res.token;
      }
      if (callback) callback(res);
      if (mutating && res && res.success) refreshAppData();
    };
    const failed = err => { if (generation !== authGeneration) return; busyActions.delete(fnName); if (errorCallback) errorCallback(err); else showToast(err.message || String(err), 'error'); };
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      const runner = google.script.run.withSuccessHandler(done).withFailureHandler(failed);
      if (fnName === 'apiLogin') runner.apiLogin(args[0], args[1]);
      else runner.apiRequest(authToken, fnName, args || []);
    } else if (typeof window.localDemoRequest === 'function') {
      Promise.resolve().then(() => window.localDemoRequest(fnName, args || [], authToken)).then(done).catch(failed);
    } else failed(new Error('Hãy mở bản preview được tạo bởi npm run build:preview hoặc bản Apps Script.'));
  }

  // --- AUTH LOGIC ---
  function handleLoginSubmit(e) {
    if (e) e.preventDefault();
    if (loginPending) return;
    const email = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;

    if (!email) {
      showToast(t('login_empty_email', 'Vui lòng nhập địa chỉ email!'), 'error');
      return;
    }

    const submitBtn = document.querySelector('#screen-login form button[type="submit"]');
    const originalText = submitBtn ? submitBtn.innerHTML : '';
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>' + t('login_loading', 'Đang đăng nhập...');
    }

    const status = document.getElementById('login-status');
    if (status) status.textContent = t('login_checking', 'Đang kiểm tra tài khoản...');
    const waitTimer = setTimeout(() => {
      if (loginPending && status) status.textContent = t('login_processing', 'Máy chủ đang xử lý, vui lòng đợi trong giây lát...');
    }, 5000);
    const finishLogin = () => {
      clearTimeout(waitTimer);
      loginPending = false;
      if (status) status.textContent = '';
      if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = originalText; }
    };
    loginPending = true;
    callBackend('apiLogin', [email, password], (res) => {
      finishLogin();
      if (res && res.success && res.profile) {
        loginAsUser(res.profile);
        showToast(t('login_success_prefix', 'Đăng nhập thành công! Xin chào ') + res.profile.name + '.', 'success');
      } else {
        const msg = (res && res.message) ? res.message : t('login_failed', 'Đăng nhập thất bại! Kiểm tra email hoặc mật khẩu.');
        showToast(msg, 'error');
      }
    }, (err) => {
      finishLogin();
      showToast(t('login_err_prefix', 'Lỗi kết nối máy chủ xác thực: ') + err.message, 'error');
    });
  }

  function fillAndLogin(email) {
    document.getElementById('login-username').value = email;
    document.getElementById('login-password').value = '123456';
    handleLoginSubmit(null);
  }

  // --- TAB NAVIGATION ---
  function switchTab(tabId) {

      if (deptFilter !== 'all' && u.dept !== deptFilter) return false;
      if (statusFilter !== 'all' && u.status !== statusFilter) return false;
      if (query) {
        const matchName = u.name.toLowerCase().includes(query);
        const matchId = u.id.toLowerCase().includes(query);
        const matchEmail = (u.email || '').toLowerCase().includes(query);
        if (!matchName && !matchId && !matchEmail) return false;
      }
      return true;
    });

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="9" class="text-center py-6 text-slate-400">${t('emp_not_found', 'Không tìm thấy nhân sự phù hợp')}</td></tr>`;

    filtered.forEach(u => {

    if (['Kế toán', 'Kế toán trưởng', 'Kế toán viên', 'Kế toán tổng hợp'].includes(t)) return 'hr';

      submitBtn.disabled = true;

    // Lưu xuống Google Sheets và chờ xác nhận trước khi cập nhật UI

    callBackend('apiSaveEmployee', [empData, callerEmail], (res) => {

  // --- RENDER 3: BẢNG CHẤM CÔNG ĐA KỲ (TIMESHEET MULTI-PERIOD) ---
  function getDaysInMonth(month, year) {
    return new Date(year, month, 0).getDate();
  }

  function generateDefaultDaysForMonth(period) {
    const parts = (period || '10/2026').split('/');
    const month = parseInt(parts[0], 10) || 10;
    const year = parseInt(parts[1], 10) || 2026;
    const totalDays = getDaysInMonth(month, year);
    const days = Array(31).fill('');
    let standardWorkingDays = 0;

    for (let d = 1; d <= 31; d++) {
      if (d <= totalDays) {
        const dt = new Date(year, month - 1, d);
        const dow = dt.getDay(); // 0: CN, 6: T7
        if (dow === 0) {
          days[d - 1] = 'CN';
        } else if (dow === 6) {
          days[d - 1] = 'T7';
        } else {
          days[d - 1] = '';
          standardWorkingDays++;
        }
      } else {
        days[d - 1] = '';
      }
    }
    return { days, daysInMonth: totalDays, standardWorkingDays };
  }

  function renderTimesheetHeader(period) {
    const tr = document.getElementById('timesheet-header-tr');
    if (!tr) return;
    const parts = (period || '10/2026').split('/');
    const month = parseInt(parts[0], 10) || 10;
    const year = parseInt(parts[1], 10) || 2026;
    const totalDays = getDaysInMonth(month, year);

    // Cập nhật badge số ngày & công chuẩn
    const info = generateDefaultDaysForMonth(period);
    const badge = document.getElementById('timesheet-days-badge');
    if (badge) {
      badge.innerText = `${totalDays} ${t('ts_days', 'ngày')} (${info.standardWorkingDays} ${t('ts_std_days', 'công chuẩn')})`;
      document.getElementById("timesheet-cutoff-note").innerText = `${t('ts_cutoff_prefix', 'Công ghi nhận đến ')}${appData.attendanceAsOf || "—"}${t('ts_cutoff_suffix', '. Ô mờ là ngày chưa đến; dấu * là lịch nghỉ dự kiến, chưa cộng vào tổng công.')}`;
    }

    let thHtml = `
      <th class="py-3 px-2 font-semibold sticky left-0 bg-slate-900 z-30 min-w-[65px] text-center border-r border-slate-800">${t('th_emp_id', 'Mã NV')}</th>
      <th class="py-3 px-3 font-semibold sticky left-[65px] bg-slate-900 z-30 min-w-[150px] border-r border-slate-800">${t('th_emp_name', 'Họ và Tên')}</th>
      <th class="py-3 px-2 font-semibold min-w-[80px] border-r border-slate-800 text-center">${t('th_emp_dept', 'Phòng Ban')}</th>
    `;

    for (let d = 1; d <= totalDays; d++) {
      const dt = new Date(year, month - 1, d);
      const dow = dt.getDay();
      const isSunday = (dow === 0);
      const isSaturday = (dow === 6);
      let thClass = 'p-1 font-semibold text-center border-r border-slate-800 matrix-cell';
      let title = `Ngày ${d}/${month}/${year}`;
      if (isSunday) {
        thClass += ' bg-rose-950 text-rose-300 font-bold';
        title += ` (${t('ts_legend_cn', 'Chủ Nhật').replace(/^CN:\s*/, '')})`;
      } else if (isSaturday) {
        thClass += ' bg-slate-800 text-slate-300 font-medium';
        title += ` (${t('ts_legend_t7', 'Thứ Bảy').replace(/^T7:\s*/, '')})`;
      }
      thHtml += `<th class="${thClass}" title="${title}">${d}</th>`;
    }

    thHtml += `
      <th class="py-3 px-2 font-bold text-center bg-blue-900 text-white min-w-[65px]">${t('th_ts_actual', 'Công Thực')}</th>
      <th class="py-3 px-2 font-bold text-center bg-indigo-900 text-white min-w-[55px]">${t('th_ts_p', 'Phép (P)')}</th>
      <th class="py-3 px-2 font-bold text-center bg-amber-900 text-white min-w-[55px]">${t('th_ts_o', 'Ốm (O)')}</th>
      <th class="py-3 px-2 font-bold text-center bg-rose-900 text-white min-w-[55px]">${t('th_ts_k', 'Không lương (K)')}</th>
      <th class="py-3 px-2 font-bold text-center bg-purple-900 text-white min-w-[55px]">${t('th_ts_ot', 'OT')}</th>
    `;
    tr.innerHTML = thHtml;
  }

  function recordedClientDays(empId) {
    const calendar = generateDefaultDaysForMonth(currentTimesheetPeriod).days;
    const raw = (appData.timesheetByPeriod[currentTimesheetPeriod] || {})[empId] || [];
    return calendar.map((symbol, index) => index < appData.attendanceCutoff ? (raw[index] || '') : symbol);
  }
  function renderTimesheet() {
    renderTimesheetHeader(currentTimesheetPeriod);
    const tbody = document.getElementById('timesheet-tbody');
    if (!tbody) return;

    const parts = currentTimesheetPeriod.split('/');
    const month = parseInt(parts[0], 10) || 10;
    const year = parseInt(parts[1], 10) || 2026;
    const totalDays = getDaysInMonth(month, year);

    if (!appData.timesheetByPeriod) appData.timesheetByPeriod = {};

    const periodMap = appData.timesheetByPeriod[currentTimesheetPeriod] || {};

    let rows = '';

    USERS_DB.filter(u => u.status !== 'Đã nghỉ việc' && (currentUser.role !== 'employee' || u.id === currentUser.id)).forEach(u => {
      const rawDays = recordedClientDays(u.id);
      const plans = (appData.plannedTimesheet || {})[u.id] || [];
      let cellsHtml = '';
      let totalX = 0, totalP = 0, totalO = 0, totalOT = 0, totalK = 0;

      for (let dIdx = 0; dIdx < totalDays; dIdx++) {
        const sym = rawDays[dIdx] || '';
        let cClass = 'cell-x';
        if (sym === 'P') { cClass = 'cell-p'; totalP++; }
        else if (sym === 'O') { cClass = 'cell-o'; totalO++; }
        else if (sym === 'K') { cClass = 'cell-k'; totalK++; }
        else if (sym === 'OT') { cClass = 'cell-ot'; totalOT++; }
        else if (sym === 'CN') { cClass = 'cell-cn'; }
        else if (sym === 'T7') { cClass = 'cell-t7'; }
        else if (sym === 'X') { totalX++; }

        const future = dIdx >= appData.attendanceCutoff;
        const display = future && plans[dIdx] ? plans[dIdx] + '*' : sym;
        if (future) cClass += ' opacity-50';

        const isDraft = Boolean(draftTimesheetChanges && draftTimesheetChanges[`${u.id}_${dIdx + 1}`]);
        if (isDraft) cClass += ' matrix-cell-draft';
        if (isTimesheetEditMode && !future && currentUser && currentUser.role === 'manager') {
          cClass += ' matrix-cell-editable';
        }

        const canEditAtt = !future && currentUser && currentUser.role === 'manager';
        const clickAttr = canEditAtt
          ? `onclick="cycleAttendanceCell('${u.id}', ${dIdx + 1}, '${sym}', event)" title="${isTimesheetEditMode ? t('ts_click_to_select', 'Bấm để mở bảng chọn 1-chạm') : t('ts_click_hint_view', 'Bật chế độ sửa công để chỉnh sửa')}" style="${isTimesheetEditMode ? 'cursor: pointer;' : 'cursor: default;'}"`
          : (future ? 'title="Chưa đến ngày; dấu * là lịch nghỉ dự kiến, chưa cộng công"' : '');

        cellsHtml += `<td class="p-0 text-center border-r border-slate-100 matrix-cell ${cClass}" ${clickAttr}>${display}</td>`;
      }

      const isMe = (currentUser && currentUser.id === u.id);
      rows += `
        <tr class="${isMe ? 'bg-blue-50/40 font-bold' : 'hover:bg-slate-50/80'} transition">
          <td class="py-2.5 px-2 font-bold sticky left-0 bg-white z-10 text-center border-r border-slate-200 text-slate-700 min-w-[65px]">${escapeHtml(u.id)}</td>
          <td class="py-2.5 px-3 sticky left-[65px] bg-white z-10 border-r border-slate-200 min-w-[150px]">
            <div class="font-bold text-slate-900">${escapeHtml(u.name)} ${isMe ? `<span class="text-[10px] text-blue-600">(${t('is_me', 'Tôi')})</span>` : ''}</div>
            <div class="text-[10px] text-slate-400">${escapeHtml(u.title)}</div>
          </td>
          <td class="py-2.5 px-2 text-center border-r border-slate-200 min-w-[80px]"><span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-semibold text-[10px]">${escapeHtml(u.dept)}</span></td>
          ${cellsHtml}
          <td class="py-2.5 px-2 text-center font-extrabold text-blue-700 bg-blue-50/50">${totalX}</td>
          <td class="py-2.5 px-2 text-center font-bold text-indigo-700 bg-indigo-50/50">${totalP}</td>
          <td class="py-2.5 px-2 text-center font-bold text-amber-700 bg-amber-50/50">${totalO}</td>
          <td class="py-2.5 px-2 text-center font-bold text-rose-700">${totalK}</td>
          <td class="py-2.5 px-2 text-center font-bold text-purple-700 bg-purple-50/50">${totalOT}</td>
        </tr>
      `;
    });
    tbody.innerHTML = rows;
    updateTimesheetEditUI();
  }

  let isTimesheetEditMode = false;
  let draftTimesheetChanges = {}; // Key: `${empId}_${day}` -> { empId, day, symbol, origSymbol }
  let activePopoverCell = null; // { empId, day, currentSym, target }

  function updateTimesheetEditUI() {
    const editBar = document.getElementById('timesheet-edit-bar');
    const toggleBtn = document.getElementById('btn-toggle-ts-edit');
    const toggleLabel = document.getElementById('btn-toggle-ts-edit-label');
    const countBadge = document.getElementById('ts-edit-count-badge');
    const saveBtn = document.getElementById('btn-save-ts-edit');

    const isManager = Boolean(currentUser && currentUser.role === 'manager');
    if (toggleBtn) {
      toggleBtn.classList.toggle('hidden', !isManager);
      if (isTimesheetEditMode) {
        toggleBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 hover:bg-amber-600 text-white shadow-sm flex items-center space-x-1.5 transition';
        if (toggleLabel) toggleLabel.innerText = t('ts_btn_exit_edit', 'Thoát Chế Độ Sửa');
      } else {
        toggleBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white shadow-sm flex items-center space-x-1.5 transition';
        if (toggleLabel) toggleLabel.innerText = t('ts_btn_edit_mode', 'Chỉnh Sửa Công');
      }
    }

    if (editBar) {
      if (isManager && isTimesheetEditMode) editBar.classList.remove('hidden');
      else editBar.classList.add('hidden');
    }

    const changedCount = Object.keys(draftTimesheetChanges).length;
    if (countBadge) {
      countBadge.innerText = t('ts_unsaved_changes', '{count} thay đổi chưa lưu').replace('{count}', String(changedCount));
    }
    if (saveBtn) {
      saveBtn.disabled = (changedCount === 0);
    }
  }

  function toggleTimesheetEditMode() {
    if (!currentUser || currentUser.role !== 'manager') return;
    if (isTimesheetEditMode && Object.keys(draftTimesheetChanges).length > 0) {
      if (typeof confirm === 'function' && !confirm(t('ts_confirm_exit_unsaved', 'Bạn có các thay đổi chưa lưu. Bạn có chắc muốn hủy bỏ và thoát chế độ sửa không?'))) {
        return;
      }
      cancelTimesheetEdit();
      return;
    }
    isTimesheetEditMode = !isTimesheetEditMode;
    closeAttendancePopover();
    updateTimesheetEditUI();
    renderTimesheet();
  }

  function cancelTimesheetEdit() {
    const period = currentTimesheetPeriod;
    Object.values(draftTimesheetChanges).forEach(item => {
      if (appData.timesheetByPeriod && appData.timesheetByPeriod[period] && appData.timesheetByPeriod[period][item.empId]) {
        appData.timesheetByPeriod[period][item.empId][item.day - 1] = item.origSymbol;
      }
    });
    draftTimesheetChanges = {};
    isTimesheetEditMode = false;
    closeAttendancePopover();
    updateTimesheetEditUI();
    renderTimesheet();
    showToast(t('ts_cancelled_changes', 'Đã hủy các thay đổi chưa lưu.'), 'info');
  }

  function saveTimesheetEdit() {
    const changes = Object.values(draftTimesheetChanges).map(item => ({
      empId: item.empId,
      day: item.day,
      symbol: item.symbol
    }));
    if (!changes.length) {
      showToast(t('ts_no_changes', 'Không có thay đổi nào cần lưu.'), 'info');
      return;
    }
    const saveBtn = document.getElementById('btn-save-ts-edit');
    if (saveBtn) {
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> ' + t('saving', 'Đang lưu...');
    }

    const period = currentTimesheetPeriod;
    callBackend('apiUpdateAttendanceBatch', [changes, period], (res) => {
      if (saveBtn) {
        saveBtn.disabled = false;
        saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-1"></i> ' + t('ts_btn_save_changes', 'Lưu Thay Đổi');
      }
      if (res && res.success) {
        draftTimesheetChanges = {};
        isTimesheetEditMode = false;
        closeAttendancePopover();
        updateTimesheetEditUI();
        renderTimesheet();
        showToast(res.message || t('ts_saved_batch_success', 'Đã lưu thành công các thay đổi trên bảng chấm công!'), 'success');
      } else {
        showToast((res && res.message) || t('ts_save_failed', 'Lỗi khi lưu bảng chấm công!'), 'error');
      }
    }, (err) => {
      if (saveBtn) {
        saveBtn.disabled = false;
        saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-1"></i> ' + t('ts_btn_save_changes', 'Lưu Thay Đổi');
      }
      showToast('Lỗi máy chủ: ' + err.message, 'error');
    });
  }

  function closeAttendancePopover() {
    const pop = document.getElementById('timesheet-popover');
    if (pop) pop.classList.add('hidden');
    activePopoverCell = null;
  }

  function openAttendancePopover(event, empId, day, currentSym) {
    if (!isTimesheetEditMode || !currentUser || currentUser.role !== 'manager' || day > appData.attendanceCutoff) return;
    const pop = document.getElementById('timesheet-popover');
    if (!pop) return;

    const targetEl = (event && (event.currentTarget || event.target)) || null;
    activePopoverCell = {
      empId: empId,
      day: day,
      currentSym: currentSym,
      target: targetEl
    };

    const user = USERS_DB.find(u => u.id === empId);
    const empName = user ? user.name : empId;
    const titleEl = document.getElementById('ts-popover-title');
    if (titleEl) titleEl.innerText = `${empName}`;
    const dateEl = document.getElementById('ts-popover-date');
    if (dateEl) dateEl.innerText = `${t('day', 'Ngày')} ${day} (${currentTimesheetPeriod})`;
    const currEl = document.getElementById('ts-popover-current');
    if (currEl) currEl.innerText = `${t('ts_popover_current', 'Hiện tại')}: [${currentSym || 'Ø'}]`;

    pop.classList.remove('hidden');

    if (targetEl && typeof targetEl.getBoundingClientRect === 'function') {
      const rect = targetEl.getBoundingClientRect();
      const popWidth = 288;
      const popHeight = 185;
      const winWidth = (typeof window !== 'undefined' ? window.innerWidth : 1024) || 1024;
      const winHeight = (typeof window !== 'undefined' ? window.innerHeight : 768) || 768;

      let left = rect.left;
      if (left + popWidth > winWidth - 16) {
        left = winWidth - popWidth - 16;
      }
      if (left < 16) left = 16;

      let top = rect.bottom + 6;
      if (rect.bottom + popHeight > winHeight - 16) {
        top = Math.max(16, rect.top - popHeight - 6);
      }

      pop.style.left = `${Math.round(left)}px`;
      pop.style.top = `${Math.round(top)}px`;
    }
  }

  function selectAttendanceSymbol(symbol) {
    if (!activePopoverCell) return;
    const { empId, day, currentSym } = activePopoverCell;
    const period = currentTimesheetPeriod;
    const draftKey = `${empId}_${day}`;

    const origSymbol = (draftTimesheetChanges[draftKey] ? draftTimesheetChanges[draftKey].origSymbol : currentSym);

    if (symbol === origSymbol) {
      delete draftTimesheetChanges[draftKey];
    } else {
      draftTimesheetChanges[draftKey] = {
        empId: empId,
        day: day,
        symbol: symbol,
        origSymbol: origSymbol
      };
    }

    if (!appData.timesheetByPeriod) appData.timesheetByPeriod = {};
    if (!appData.timesheetByPeriod[period]) appData.timesheetByPeriod[period] = appData.timesheet || {};
    if (appData.timesheetByPeriod[period][empId]) {
      appData.timesheetByPeriod[period][empId][day - 1] = symbol;
    }

    closeAttendancePopover();
    renderTimesheet();
  }

  function changeTimesheetPeriod(period) {
    if (!/^(0[1-9]|1[0-2])\/20\d{2}$/.test(period)) return;
    if (isTimesheetEditMode && Object.keys(draftTimesheetChanges).length > 0) {
      if (typeof confirm === 'function' && !confirm(t('ts_confirm_exit_unsaved', 'Bạn có các thay đổi chưa lưu. Bạn có chắc muốn chuyển kỳ và hủy bỏ các thay đổi này?'))) {
        setPeriodSelect('timesheet-period-select', currentTimesheetPeriod);
        return;
      }
      draftTimesheetChanges = {};
      isTimesheetEditMode = false;
      updateTimesheetEditUI();
    }
    closeAttendancePopover();
    currentTimesheetPeriod = period;
    setPeriodSelect('timesheet-period-select', period);

    if (timesheetCacheByPeriod && timesheetCacheByPeriod[period]) {
      const cached = timesheetCacheByPeriod[period];
      appData.timesheet = cached.timesheet;
      appData.attendanceCutoff = cached.cutoff;
      appData.attendanceAsOf = cached.asOf;
      appData.plannedTimesheet = cached.plannedTimesheet || {};
      if (!appData.timesheetByPeriod) appData.timesheetByPeriod = {};
      appData.timesheetByPeriod[period] = cached.timesheet;
      renderTimesheet();
      renderDashboard();
      return;
    }

    const version = ++requestVersion;
    const tbody = document.getElementById('timesheet-tbody');
    if (tbody) {
      tbody.innerHTML = `<tr><td colspan="40" class="py-8 text-center text-slate-500 font-medium"><i class="fa-solid fa-spinner fa-spin text-blue-600 text-base mr-2"></i> ${t('loading', 'Đang tải dữ liệu kỳ công...')}</td></tr>`;
    }
    callBackend('apiGetAttendance', [period], res => {
      if (version !== requestVersion) return;
      if (!res || !res.success) {
        showToast((res && res.message) || t('ts_load_failed', 'Không tải được bảng chấm công kỳ này.'), 'error');
        renderTimesheet();
        return;
      }
      if (!timesheetCacheByPeriod) timesheetCacheByPeriod = {};
      timesheetCacheByPeriod[period] = {
        timesheet: res.timesheet,
        cutoff: res.cutoff,
        asOf: res.asOf,
        plannedTimesheet: res.plannedTimesheet || {}
      };
      appData.timesheet = res.timesheet;
      appData.attendanceCutoff = res.cutoff;
      appData.attendanceAsOf = res.asOf;
      appData.plannedTimesheet = res.plannedTimesheet || {};
      if (!appData.timesheetByPeriod) appData.timesheetByPeriod = {};
      appData.timesheetByPeriod[period] = res.timesheet;
      renderTimesheet();
      renderDashboard();
    }, err => {
      if (version !== requestVersion) return;
      showToast('Lỗi máy chủ: ' + err.message, 'error');
      renderTimesheet();
    });
  }

  function prevTimesheetPeriod() {
    const parts = currentTimesheetPeriod.split('/');
    let m = parseInt(parts[0], 10);
    let y = parseInt(parts[1], 10);
    m--;
    if (m < 1) { m = 12; y--; }
    const newPeriod = `${String(m).padStart(2, '0')}/${y}`;
    changeTimesheetPeriod(newPeriod);
  }

  function nextTimesheetPeriod() {
    const parts = currentTimesheetPeriod.split('/');
    let m = parseInt(parts[0], 10);
    let y = parseInt(parts[1], 10);
    m++;
    if (m > 12) { m = 1; y++; }
    const newPeriod = `${String(m).padStart(2, '0')}/${y}`;
    changeTimesheetPeriod(newPeriod);
  }

  function cycleAttendanceCell(empId, day, currentSym, event) {
    if (loadingData || busyActions.has('apiUpdateAttendanceCell') || busyActions.has('apiUpdateAttendanceBatch')) return;
    if (!currentUser || currentUser.role !== 'manager' || day > appData.attendanceCutoff) return;

    if (!isTimesheetEditMode) {
      showToast(t('ts_hint_turn_on_edit', 'Bảng công đang ở chế độ xem an toàn. Bấm "Chỉnh Sửa Công" để sửa.'), 'info');
      return;
    }

    openAttendancePopover(event, empId, day, currentSym);
  }

    window.cancelTimesheetEdit = cancelTimesheetEdit;
    window.saveTimesheetEdit = saveTimesheetEdit;
    window.closeAttendancePopover = closeAttendancePopover;
    window.openAttendancePopover = openAttendancePopover;

  // Xuất bảng chấm công sang file Excel (.xls) định dạng HTML Table đơn giản
  function exportTimesheetExcel() {
    if (loadingData) { showToast(t('ts_wait_load_excel', 'Đợi bảng công tải xong rồi xuất Excel.'), 'info'); return; }
    const period = currentTimesheetPeriod, info = generateDefaultDaysForMonth(period);
    const rows = [
      ['BẢNG CHẤM CÔNG — WANZHONG VIỆT NAM'],
      ['Kỳ', period, 'Công ghi nhận đến', appData.attendanceAsOf, '*: Lịch nghỉ dự kiến, chưa cộng công'],
      ['Mã NV', 'Họ và tên', 'Phòng ban', 'Chức danh', ...Array.from({ length: info.daysInMonth }, (_, i) => i + 1), 'Công X', 'Phép P', 'Ốm O', 'Không lương K', 'OT']
    ];
    USERS_DB.filter(u => u.status !== 'Đã nghỉ việc' && (currentUser.role !== 'employee' || u.id === currentUser.id)).forEach(u => {
      const days = recordedClientDays(u.id).slice(0, info.daysInMonth);
      const plans = (appData.plannedTimesheet || {})[u.id] || [];
      const display = days.map((symbol, index) => index >= appData.attendanceCutoff && plans[index] ? plans[index] + ' (dự kiến)' : symbol);
      rows.push([u.id, u.name, u.dept, u.title, ...display, ...['X', 'P', 'O', 'K', 'OT'].map(symbol => days.filter(d => d === symbol).length)]);
    });

    let tableHtml = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">';
    tableHtml += '<head><meta charset="utf-8"></head><body><table border="1">';
    rows.forEach(r => {
      tableHtml += '<tr>' + r.map(c => '<td>' + escapeHtml(c) + '</td>').join('') + '</tr>';
    });
    tableHtml += '</table></body></html>';

    const blob = new Blob([tableHtml], { type: 'application/vnd.ms-excel;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'Bang_cong_' + period.replace('/', '_') + '.xls';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('Đã xuất bảng công kỳ ' + period + '.');
  }

    const searchKeyword = (document.getElementById('doc-search-input') ? document.getElementById('doc-search-input').value.trim().toLowerCase() : '');
    const filterType = (document.getElementById('doc-type-filter') ? document.getElementById('doc-type-filter').value : '');
    const filterCategory = (document.getElementById('doc-category-filter') ? document.getElementById('doc-category-filter').value : '');

    let docs = appData.documents || [];

    // Lọc theo từ khóa tìm kiếm (Số hiệu, Tiêu đề, Cơ quan, Lĩnh vực)
    if (searchKeyword) {
      docs = docs.filter(d =>
        (d.id && d.id.toLowerCase().includes(searchKeyword)) ||
        (d.title && d.title.toLowerCase().includes(searchKeyword)) ||
        (d.issuer && d.issuer.toLowerCase().includes(searchKeyword)) ||
        (d.category && d.category.toLowerCase().includes(searchKeyword))
      );
    }

    // Lọc theo loại văn bản (bao gồm nhóm Văn bản tiền lương)
    if (filterType && filterType !== 'all') {
      if (filterType === 'salary_docs') {
        docs = docs.filter(d =>
          (d.category && d.category.toLowerCase().includes('lương')) ||
          (d.title && d.title.toLowerCase().includes('lương')) ||
          (d.id && d.id.toLowerCase().includes('luong')) ||
          (d.type === 'Quy chế nội bộ' && d.title.toLowerCase().includes('lương'))
        );
      } else {
        docs = docs.filter(d => d.type === filterType);
      }
    }

    // Lọc theo Lĩnh Vực pháp luật / chuyên môn
    if (filterCategory && filterCategory !== 'all') {
      docs = docs.filter(d => d.category === filterCategory);
    }

    const canManageAnyDoc = currentUser && currentUser.role !== 'employee';
    const thActions = document.getElementById('th-doc-actions');
    if (thActions) thActions.classList.toggle('hidden', !canManageAnyDoc);

    if (docs.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="${canManageAnyDoc ? 9 : 8}" class="py-8 text-center text-slate-400">
            <i class="fa-solid fa-magnifying-glass text-2xl mb-2 text-slate-300"></i>
            <p class="text-sm font-medium">${t('docs_not_found', 'Không tìm thấy văn bản phù hợp với bộ lọc tìm kiếm.')}</p>
          </td>
        </tr>
      `;
      return;
    }

    let html = '';
    docs.forEach(d => {
      const catBadge = d.category
        ? `<span class="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-blue-50 text-blue-700 border border-blue-200">${escapeHtml(d.category)}</span>`
        : `<span class="text-slate-400 text-xs">---</span>`;

      html += `
        <tr class="hover:bg-slate-50 transition">
          <td class="py-3 px-4 font-bold text-slate-800">${escapeHtml(d.id)}</td>
          <td class="py-3 px-4 font-bold text-slate-900"><div class="doc-title">${escapeHtml(d.title)}</div></td>
          <td class="py-3 px-4"><span class="px-2 py-0.5 rounded bg-amber-50 text-amber-800 font-medium text-xs">${escapeHtml(d.type)}</span></td>
          <td class="py-3 px-4">${catBadge}</td>
          <td class="py-3 px-4 text-slate-600">${escapeHtml(d.issuer)}</td>
          <td class="py-3 px-4 text-slate-500">${escapeHtml(d.date)}</td>
          <td class="py-3 px-4 text-center">
            <div class="docs-file-actions"><button data-attachment-kind="doc" data-attachment-id="${escapeHtml(d.id)}" class="text-blue-700">${t('btn_doc_view', 'Xem')}</button><button data-attachment-kind="doc" data-attachment-id="${escapeHtml(d.id)}" data-download="true" class="text-blue-700">${t('btn_doc_download', 'Tải')}</button></div>
          </td>
          <td class="py-3 px-4 text-center"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">${escapeHtml(d.status || t('docs_status_valid', 'Hiệu lực'))}</span></td>
          <td class="py-3 px-4 text-right doc-actions-col ${canManageAnyDoc ? '' : 'hidden'}">
            <div class="flex items-center justify-end space-x-1.5">
              <button data-edit-doc="${escapeHtml(d.id)}"
                class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded font-semibold text-[11px] inline-flex items-center space-x-1 border border-slate-300 transition" title="Chỉnh sửa văn bản">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              <button data-manager-only data-assign-doc="${escapeHtml(d.id)}"
                class="px-2 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 hover:text-indigo-900 rounded font-semibold text-[11px] inline-flex items-center space-x-1 border border-indigo-200 transition" title="Giao việc theo văn bản này">
                <i class="fa-solid fa-list-check"></i>
              </button>
            </div>
          </td>
        </tr>
      `;
    });
    tbody.innerHTML = html;

  function handleSaveLeave(e) {
    e.preventDefault();
    const mode = (document.getElementById('leave-form-mode') ? document.getElementById('leave-form-mode').value : 'create');
    const editId = (document.getElementById('leave-form-id') ? document.getElementById('leave-form-id').value : '');
    const type = (document.getElementById('leave-type') ? document.getElementById('leave-type').value : 'Nghỉ phép năm');
    const from = document.getElementById('leave-from').value;
    const to = document.getElementById('leave-to').value;
    const inputDays = parseInt(document.getElementById('leave-days').value, 10);
    const days = (Number.isFinite(inputDays) && inputDays > 0) ? inputDays : workingDayCount(from, to);
    const reason = document.getElementById('leave-reason').value;

    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn ? submitBtn.innerHTML : '';
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>' + (mode === 'edit' ? t('leave_updating', 'Đang lưu...') : t('leave_submitting', 'Đang gửi đơn...'));
    }

    const callerEmail = currentUser ? currentUser.email : '';

    if (mode === 'edit') {
      const updateObj = {
        id: editId,
        empId: currentUser.id,
        type: type,
        from: from,
        to: to,
        days: days,
        reason: reason
      };
      callBackend('apiUpdateLeave', [updateObj, callerEmail], (res) => {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
        }
        if (res && res.success) {
          const req = appData.leaveRequests.find(r => r.id === editId);
          if (req) {
            req.type = type;
            req.from = from;
            req.to = to;
            req.days = days;
            req.reason = reason;
          }
          closeModal('modal-leave');
          showToast(res.message || t('leave_update_success', 'Đã cập nhật đơn nghỉ phép thành công!'), 'success');
          renderDashboard();
          renderLeaveTable();
        } else {
          showToast((res && res.message) || t('leave_update_failed', 'Lỗi cập nhật đơn nghỉ phép!'), 'error');
        }
      }, (err) => {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
        }
        showToast('Lỗi kết nối máy chủ: ' + err.message, 'error');
      });
    } else {
      const newId = 'LV-' + Math.floor(1000 + Math.random() * 9000);
      const leaveObj = {
        id: newId,
        empId: currentUser.id,
        empName: currentUser.name,
        type: type,
        from: from,
        to: to,
        days: days,
        reason: reason,
        status: 'PENDING'
      };

      callBackend('apiSubmitLeave', [leaveObj, callerEmail], (res) => {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
        }
        if (res && res.success) {
          if (res.newId) leaveObj.id = res.newId;
          appData.leaveRequests.unshift(leaveObj);
          closeModal('modal-leave');
          showToast(res.message || `Nộp đơn ${leaveObj.id} thành công!`, 'success');
          renderDashboard();
          renderLeaveTable();
          switchTab('leave');
        } else {
          showToast((res && res.message) || 'Lỗi nộp đơn nghỉ phép!', 'error');
        }
      }, (err) => {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
        }
        showToast('Lỗi kết nối máy chủ: ' + err.message, 'error');
      });
    }
  }

  function handleCreateSick(e) {
    e.preventDefault();
    const hospital = document.getElementById('sick-hospital').value;
    const from = document.getElementById('sick-from').value;
    const to = document.getElementById('sick-to').value;

    const calcDays = workingDayCount(from, to);
    if (!calcDays) { showToast(t('leave_range_working_days', 'Khoảng nghỉ phải có ngày làm việc hợp lệ.'), 'error'); return; }
    if (!selectedSickFile) { showToast(t('sick_proof_required', 'Vui lòng chọn chứng từ.'), 'error'); return; }

    const newId = 'SC-' + Math.floor(1000 + Math.random() * 9000);
    const sickObj = {
      id: newId,
      empId: currentUser.id,
      empName: currentUser.name,
      hospital: hospital,
      from: from,
      to: to,
      days: calcDays,
      status: 'PENDING'
    };

    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn ? submitBtn.innerHTML : '';
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up fa-bounce mr-2"></i>Đang tải lên Drive...';
    }

    const doSubmit = (fileData) => {
      if (fileData) sickObj.fileData = fileData;
      const callerEmail = currentUser ? currentUser.email : '';
      callBackend('apiSubmitSick', [sickObj, callerEmail], (res) => {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
        }
        if (res && res.success) {
          if (res.newId) sickObj.id = res.newId;
          if (res.docUrl) sickObj.docUrl = res.docUrl;
          appData.sickCases.unshift(sickObj);
          closeModal('modal-sick');
          clearSickFile();
          showToast(res.message || `Nộp hồ sơ ốm đau ${sickObj.id} (${calcDays} ngày) thành công!`, 'success');
          renderDashboard();
          renderSickTable();
          switchTab('sick');
        } else {
          showToast((res && res.message) || 'Lỗi nộp hồ sơ ốm đau!', 'error');
        }
      }, (err) => {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
        }
        showToast('Lỗi kết nối máy chủ: ' + err.message, 'error');
      });
    };

    if (selectedSickFile) {
      const reader = new FileReader();
      reader.onload = function (evt) {
        doSubmit({
          name: selectedSickFile.name,
          type: selectedSickFile.type,
          base64: evt.target.result
        });
      };
      reader.onerror = function () {
        showToast(t('cannot_read_file', "Không thể đọc tệp tin cục bộ!"), "error");
        doSubmit(null);
      };
      reader.readAsDataURL(selectedSickFile);
    } else {
      doSubmit(null);
    }
  }

  let toastTimer;
  function showToast(msg, type = 'success', params = {}) {
    clearTimeout(toastTimer);
    const toast = document.getElementById('toast');
    if (!toast) return;

    let finalMsg = '';
    if (typeof msg === 'object' && msg !== null) {
      params = msg.params || params;
      type = msg.success === false ? 'error' : (msg.type || type);
      finalMsg = msg.code ? t(msg.code, params) : (msg.message || '');
    } else if (typeof msg === 'string') {
      finalMsg = t(msg, params);
    } else {
      finalMsg = String(msg || '');
    }

    const msgEl = document.getElementById('toast-msg');
    if (msgEl) msgEl.innerText = finalMsg;

    const iconEl = document.getElementById('toast-icon');
    if (iconEl) {
      if (type === 'error') {
        iconEl.className = 'text-rose-400 text-base';
        iconEl.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i>';
      } else if (type === 'info') {
        iconEl.className = 'text-blue-400 text-base';
        iconEl.innerHTML = '<i class="fa-solid fa-circle-info"></i>';
      } else if (type === 'warning') {
        iconEl.className = 'text-amber-400 text-base';
        iconEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
      } else {
        iconEl.className = 'text-emerald-400 text-base';
        iconEl.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
      }
    }

    toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
    toastTimer = setTimeout(() => {
      toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
    }, 4000);
  }

  function money(value) { return (Number(value) || 0).toLocaleString('vi-VN') + ' đ'; }
  function safeUrl(value) { if (!value || typeof value !== 'string') return '#'; var t = value.trim(); return (t.indexOf('https:\u002f\u002f') === 0 || t.indexOf('http:\u002f\u002f') === 0) ? escapeHtml(t) : '#'; }
  function isoDate(value) { return value && value.includes('/') ? value.split('/').reverse().join('-') : value || ''; }
  function setPeriodSelect(id, period) {
    const select = document.getElementById(id); if (!select) return;
    if (!Array.from(select.options).some(o => o.value === period)) select.add(new Option('Tháng ' + period, period));
    select.value = period;
  }
  function workingDayCount(from, to) {
    const start = new Date(from + 'T00:00:00Z'), end = new Date(to + 'T00:00:00Z');
    if (!Number.isFinite(start.getTime()) || !Number.isFinite(end.getTime()) || end < start || (end - start) / 86400000 > 365) return 0;
    let count = 0; for (let d = new Date(start); d <= end; d.setUTCDate(d.getUTCDate() + 1))if (![0, 6].includes(d.getUTCDay())) count++;
    return count > 0 ? count : (Math.round((end.getTime() - start.getTime()) / 86400000) + 1);
  }

      timesheetCacheByPeriod = {

  function viewAttachment(kind, id, download) {

    callBackend('apiReadAttachment', [kind, id], res => {
      if (!res || !res.success) { if (tab) tab.close(); showToast(res && res.message || 'Không mở được tài liệu.', 'error'); return; }
      if (res.url) { if (tab) tab.location.href = res.url; else window.open(res.url, '_blank', 'noopener'); return; }
      const bytes = Uint8Array.from(atob(res.content), c => c.charCodeAt(0));
      const url = URL.createObjectURL(new Blob([bytes], { type: res.mimeType }));
      if (tab) tab.location.href = url;
      else { const a = document.createElement('a'); a.href = url; a.download = res.fileName; document.body.appendChild(a); a.click(); a.remove(); }
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }, err => { if (tab) tab.close(); showToast(err.message, 'error'); });
  }
  document.addEventListener('click', event => {
    const edit = event.target.closest('[data-edit-doc]'), assign = event.target.closest('[data-assign-doc]');
    if (edit) editDoc(edit.dataset.editDoc);
    if (assign) assignTaskFromDoc(assign.dataset.assignDoc);
    const target = event.target.closest('[data-attachment-kind]');
    if (target && !target.onclick) viewAttachment(target.dataset.attachmentKind, target.dataset.attachmentId, target.dataset.download === 'true');
  });
  ['leave-from', 'leave-to'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('change', () => {
        const target = document.getElementById('leave-days');
        if (target) target.value = workingDayCount(document.getElementById('leave-from').value, document.getElementById('leave-to').value);
      });
    }
  });

  // Tự động gắn sự kiện submit trực tiếp vào form đăng nhập
  function bindLoginForm() {
    initI18n();
    const form = document.getElementById('login-form') || document.querySelector('#screen-login form');
    if (form && !form.__bound) {
      form.__bound = true;
      form.addEventListener('submit', handleLoginSubmit);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bindLoginForm);
  } else {
    bindLoginForm();
  }
  initI18n();
  console.log('Wanzhong Clean Technology - Client scripts loaded.');
</script>
