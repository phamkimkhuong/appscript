  // --- CALL BACKEND BRIDGE ---
  function callBackend(fnName, args, callback, errorCallback) {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      let runner = google.script.run
        .withSuccessHandler(res => { if (callback) callback(res); })
        .withFailureHandler(err => {
          console.error("Lỗi gọi Apps Script Backend:", err);
          if (errorCallback) errorCallback(err);
          else showToast("Lỗi máy chủ: " + err.message, "error");
        });
      if (args && args.length > 0) {
        runner[fnName].apply(runner, args);
      } else {
        runner[fnName]();
      }
    } else {
      // Fallback môi trường Local Browser Preview
      setTimeout(() => {
        if (fnName === 'apiLogin') {
          const email = (args && args[0]) ? args[0].trim().toLowerCase() : '';
          const pass = (args && args[1]) ? args[1] : '';
          const user = USERS_DB.find(u => u.email.toLowerCase() === email);
          if (!user) {
            if (callback) callback({ success: false, message: "Tài khoản email không tồn tại trong hệ thống!" });
            return;
          }
          if (pass !== '123456') {
            if (callback) callback({ success: false, message: "Mật khẩu không chính xác!" });
            return;
          }
          if (callback) callback({ success: true, profile: user });
        } else if (fnName === 'apiGetInitialAppData') {
          if (callback) callback({
            success: true,
            data: {
              users: USERS_DB,
              timesheet: appData.timesheet,
              leaves: appData.leaveRequests,
              sickCases: appData.sickCases,
              payroll: appData.payroll,
              tasks: appData.tasks,
              documents: appData.documents
            }
          });
        } else {
          if (callback) callback({ success: true, message: "Thao tác mô phỏng thành công!" });
        }
      }, 150);
    }
  }

  // --- AUTH LOGIC ---
  function handleLoginSubmit(e) {
    if (e) e.preventDefault();
    const email = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;

    if (!email) {
      showToast('Vui lòng nhập địa chỉ email!', 'error');
      return;
    }

    const submitBtn = document.querySelector('#screen-login form button[type="submit"]');
    const originalText = submitBtn ? submitBtn.innerHTML : '';
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Đang xác thực...';
    }

    callBackend('apiLogin', [email, password], (res) => {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
      if (res && res.success && res.profile) {
        loginAsUser(res.profile);
        showToast(`Đăng nhập thành công! Xin chào ${res.profile.name}.`, 'success');
      } else {
        const msg = (res && res.message) ? res.message : 'Đăng nhập thất bại! Kiểm tra email hoặc mật khẩu.';
        showToast(msg, 'error');
      }
    }, (err) => {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
      showToast('Lỗi kết nối máy chủ xác thực: ' + err.message, 'error');
    });
  }

  function fillAndLogin(email) {
    document.getElementById('login-username').value = email;
    document.getElementById('login-password').value = '123456';

  function loginAsUser(user) {
    currentUser = user;
    document.getElementById('screen-login').classList.add('hidden');
    document.getElementById('screen-app').classList.remove('hidden');

    // Update Header
    document.getElementById('user-name').innerText = user.name;
    document.getElementById('user-role-label').innerText = `${user.title} (${user.dept})`;
    document.getElementById('user-avatar').src = user.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces';
    document.getElementById('greet-name').innerText = user.name;
    document.getElementById('greet-badge').innerText = user.role === 'employee' ? 'Nhân Viên' : user.role === 'manager' ? 'Quản Lý / Trưởng Phòng' : 'HR & Kế Toán';

    // Phân quyền hiển thị nút Thêm Nhân Viên
    const addEmpBtn = document.getElementById('btn-add-employee');
    if (addEmpBtn) {
      if (user.role === 'employee') {
        addEmpBtn.classList.add('hidden');
      } else {
        addEmpBtn.classList.remove('hidden');
      }
    }

    // Populate Assignee Select in Task Modal
    populateAssigneeSelect();

    // Kết nối fetch dữ liệu thật từ Google Sheets theo quyền người dùng
    callBackend('apiGetInitialAppData', [user.email], (res) => {
      if (res && res.success && res.data) {
        if (res.data.users && res.data.users.length) USERS_DB = res.data.users;
        if (res.data.timesheet) appData.timesheet = res.data.timesheet;
        if (res.data.leaves) appData.leaveRequests = res.data.leaves;
        if (res.data.sickCases) appData.sickCases = res.data.sickCases;
        if (res.data.payroll) appData.payroll = res.data.payroll;
        if (res.data.tasks) appData.tasks = res.data.tasks;
        if (res.data.documents) appData.documents = res.data.documents;
        document.getElementById('sync-status').classList.remove('hidden');
      }
      initApp();
    });

    initApp();
  }

  function handleLogout() {

  function switchTab(tabId) {

    });

    const pane = document.getElementById(`pane-${tabId}`);
    if (pane) pane.classList.remove('hidden');

    const btn = document.getElementById(`tab-btn-${tabId}`);
    if (btn) btn.className = 'nav-tab active px-3.5 py-2 rounded-lg text-sm font-semibold flex items-center space-x-2 text-blue-600 bg-blue-50 whitespace-nowrap shrink-0 transition';

    if (tabId === 'dashboard') renderDashboard();
    if (tabId === 'employees') renderEmployees();
    if (tabId === 'timesheet') renderTimesheet();
    if (tabId === 'leave') renderLeaveTable();
    if (tabId === 'sick') renderSickTable();
    if (tabId === 'payroll') renderPayrollTable();
    if (tabId === 'tasks') renderTasksTable();
    if (tabId === 'docs') renderDocsTable();

  // --- RENDER 1: DASHBOARD ---
  function renderDashboard() {
    const pList = document.getElementById('dash-pending-list');

    const badgeSick = document.getElementById('sick-pending-badge');
    const kpiPending = document.getElementById('kpi-pending-total');
    const roleNotice = document.getElementById('role-notice');
    const kpiTotal = document.getElementById('kpi-total-emp');
    const kpiTotalSub = document.getElementById('kpi-total-emp-sub');
    const kpiActiveTasks = document.getElementById('kpi-active-tasks');

    kpiTotal.innerText = USERS_DB.length;
    kpiTotalSub.innerText = USERS_DB.length;
    kpiActiveTasks.innerText = appData.tasks.filter(t => t.status !== 'Hoàn thành').length;

    let pendings = [];

    // Lọc đơn nghỉ phép theo quyền hạn bảo mật
    appData.leaveRequests.filter(r => r.status === 'PENDING').forEach(r => {
      // Nhân viên chỉ thấy đơn của chính mình
      if (currentUser.role === 'employee' && r.empId !== currentUser.id) return;

      pendings.push({
        type: 'leave',
        id: r.id,
        title: `Đơn xin nghỉ phép (${r.type} - ${r.days} ngày)`,
        sub: `${r.empName} • Từ ${r.from} đến ${r.to} • Lý do: "${r.reason}"`,
        canApprove: (currentUser.role === 'manager' || currentUser.role === 'hr'),
        roleReq: currentUser.role === 'employee' ? 'Đang chờ Quản lý duyệt' : 'Quản lý duyệt'
      });
    });

    // Lọc hồ sơ ốm đau theo quyền hạn bảo mật
    appData.sickCases.filter(s => s.status === 'PENDING').forEach(s => {
      // Nhân viên chỉ thấy hồ sơ ốm đau của chính mình (bảo mật thông tin y tế)
      if (currentUser.role === 'employee' && s.empId !== currentUser.id) return;

      pendings.push({
        type: 'sick',
        id: s.id,
        title: `Hồ sơ nghỉ ốm hưởng BHXH (${s.days} ngày)`,
        sub: `${s.empName} • ${s.hospital} • Từ ${s.from} đến ${s.to}`,
        canApprove: (currentUser.role === 'hr'),
        roleReq: currentUser.role === 'employee' ? 'Đang chờ HR duyệt BHXH' : 'HR & Kế toán duyệt'
      });
    });

    kpiPending.innerText = pendings.length;

    // Cập nhật Badge trên thanh Menu Tab theo quyền
    const leavesPendingCount = appData.leaveRequests.filter(r => r.status === 'PENDING' && (currentUser.role !== 'employee' || r.empId === currentUser.id)).length;
    const sickPendingCount = appData.sickCases.filter(s => s.status === 'PENDING' && (currentUser.role !== 'employee' || s.empId === currentUser.id)).length;

    if (leavesPendingCount > 0) {
      badgeLeave.innerText = leavesPendingCount;
      badgeLeave.classList.remove('hidden');
    } else {
      badgeLeave.classList.add('hidden');
    }

    if (sickPendingCount > 0) {
      badgeSick.innerText = sickPendingCount;
      badgeSick.classList.remove('hidden');
    } else {
      badgeSick.classList.add('hidden');
    }

    if (currentUser.role === 'employee') {
      roleNotice.innerText = 'Chế độ cá nhân: Theo dõi tiến độ phê duyệt hồ sơ của bạn';
    } else if (currentUser.role === 'manager') {
      roleNotice.innerText = 'Quyền Trưởng phòng: Thẩm quyền phê duyệt Đơn xin nghỉ phép';
    } else {
      roleNotice.innerText = 'Quyền HR/Kế toán: Thẩm quyền duyệt hồ sơ BHXH & Bảng lương';
    }

    if (pendings.length === 0) {
      pList.innerHTML = `
        <div class="text-center py-10 text-slate-400">
          <i class="fa-solid fa-circle-check text-emerald-500 text-3xl mb-2.5"></i>
          <p class="text-xs sm:text-sm font-medium text-slate-600">
            ${currentUser.role === 'employee'
              ? 'Bạn hiện không có đơn nào đang chờ xử lý. Tất cả quy trình đã hoàn tất!'
              : 'Hiện tại không có đơn nào đang chờ xử lý. Tất cả quy trình đã hoàn tất!'}
          </p>
        </div>
      `;
      return;
    }

    let html = '';
    pendings.forEach(p => {
      let actionBtn = '';
      if (p.canApprove) {
        if (p.type === 'leave') {
          actionBtn = `
            <div class="flex items-center space-x-1.5">
              <button onclick="approveLeave('${p.id}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold shadow-sm transition flex items-center space-x-1"><i class="fa-solid fa-check mr-1"></i><span>Duyệt</span></button>
              <button onclick="rejectLeave('${p.id}')" class="px-2.5 py-1.5 bg-rose-100 hover:bg-rose-200 text-rose-700 rounded-lg text-xs font-bold transition flex items-center space-x-1"><i class="fa-solid fa-xmark"></i></button>
            </div>`;
        } else {
          actionBtn = `
            <div class="flex items-center space-x-1.5">
              <button onclick="approveSick('${p.id}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold shadow-sm transition flex items-center space-x-1"><i class="fa-solid fa-check mr-1"></i><span>Duyệt BHXH</span></button>
              <button onclick="rejectSick('${p.id}')" class="px-2.5 py-1.5 bg-rose-100 hover:bg-rose-200 text-rose-700 rounded-lg text-xs font-bold transition flex items-center space-x-1"><i class="fa-solid fa-xmark"></i></button>
            </div>`;
        }
      } else {
        actionBtn = `<span class="text-xs px-3 py-1.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200/80 font-semibold flex items-center space-x-1"><i class="fa-solid fa-clock"></i><span>${p.roleReq}</span></span>`;
      }

      html += `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-slate-50/70 hover:bg-slate-100/80 rounded-2xl border border-slate-200/80 transition duration-150 gap-3">
          <div class="flex items-center space-x-3.5">
            <div class="w-10 h-10 rounded-xl ${p.type === 'leave' ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700'} flex items-center justify-center text-base font-bold shrink-0 shadow-sm">
              <i class="${p.type === 'leave' ? 'fa-solid fa-file-pen' : 'fa-solid fa-heart-pulse'}"></i>
            </div>
            <div>
              <div class="text-sm font-bold text-slate-900">${p.title}</div>
              <div class="text-xs text-slate-500 mt-0.5">${p.sub}</div>
            </div>
          </div>
          <div class="self-end sm:self-center shrink-0">${actionBtn}</div>
        </div>
      `;
    });
    pList.innerHTML = html;
  }

  // --- RENDER 2: QUẢN LÝ NHÂN SỰ (EMPLOYEES) ---
  function renderEmployees() {
    const tbody = document.getElementById('employees-tbody');
    const deptFilter = document.getElementById('emp-filter-dept').value;
    const statusFilter = document.getElementById('emp-filter-status').value;
    const query = (document.getElementById('emp-search-input').value || '').trim().toLowerCase();

    let filtered = USERS_DB.filter(u => {
      if (deptFilter !== 'all' && u.dept !== deptFilter) return false;
      if (statusFilter !== 'all' && u.status !== statusFilter) return false;
      if (query) {
        const matchName = u.name.toLowerCase().includes(query);
        const matchId = u.id.toLowerCase().includes(query);
        const matchEmail = (u.email || '').toLowerCase().includes(query);
        if (!matchName && !matchId && !matchEmail) return false;
      }
      return true;
    });

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="9" class="text-center py-6 text-slate-400">Không tìm thấy nhân sự phù hợp</td></tr>`;
      return;
    }

    let html = '';
    filtered.forEach(u => {
      const canEdit = (currentUser.role === 'manager' || currentUser.role === 'hr');
      const roleBadge = u.role === 'manager'

  function handleSaveEmployee(e) {
    e.preventDefault();
    const mode = document.getElementById('emp-form-mode').value;
    const empData = {
      id: document.getElementById('emp-form-id').value.trim(),
      name: document.getElementById('emp-form-name').value.trim(),
      email: document.getElementById('emp-form-email').value.trim(),
      phone: document.getElementById('emp-form-phone').value.trim(),
      dept: document.getElementById('emp-form-dept').value,
      title: document.getElementById('emp-form-title').value.trim(),
      role: document.getElementById('emp-form-role').value,
      salary: Number(document.getElementById('emp-form-salary').value) || 0,
      status: document.getElementById('emp-form-status').value,
      startDate: document.getElementById('emp-form-date').value.trim(),
      avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces'
    };

    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn ? submitBtn.innerHTML : '';
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Đang lưu vào Sheet...';
    }

    // Lưu xuống Google Sheets và chờ xác nhận trước khi cập nhật UI
    callBackend('apiSaveEmployee', [empData], (res) => {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
      if (res && res.success) {
        if (mode === 'add') {
          USERS_DB.push(empData);
          if (!appData.timesheet[empData.id]) {
            const defaultDays = Array(31).fill('X');
            [3, 10, 17, 24].forEach(idx => { defaultDays[idx] = 'CN'; });
            [2, 9, 16, 23, 30].forEach(idx => { defaultDays[idx] = 'T7'; });
            appData.timesheet[empData.id] = defaultDays;
          }
        } else {
          const idx = USERS_DB.findIndex(x => x.id === empData.id);
          if (idx >= 0) USERS_DB[idx] = empData;
        }

        closeModal('modal-employee');
        populateAssigneeSelect();
        renderEmployees();
        renderDashboard();
        showToast(res.message || 'Lưu thông tin nhân sự thành công!', 'success');
      } else {
        showToast((res && res.message) || 'Lưu nhân sự thất bại!', 'error');
      }
    }, (err) => {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
      showToast('Lỗi máy chủ khi lưu nhân sự: ' + err.message, 'error');
    });
  }

  function deleteEmployee(empId) {
    if (!confirm(`Bạn có chắc chắn muốn chuyển trạng thái nhân viên [${empId}] sang 'Đã nghỉ việc'?`)) return;

    callBackend('apiDeleteEmployee', [empId], (res) => {
      if (res && res.success) {
        const u = USERS_DB.find(x => x.id === empId);
        if (u) u.status = 'Đã nghỉ việc';
        showToast(res.message || `Đã chuyển trạng thái nhân viên ${empId} sang Đã nghỉ việc!`, 'success');
        renderEmployees();
        renderDashboard();
      } else {
        showToast((res && res.message) || 'Thao tác xóa nhân viên thất bại!', 'error');
      }
    }, (err) => {
      showToast('Lỗi kết nối máy chủ: ' + err.message, 'error');
    });
  }

  // --- RENDER 3: BẢNG CHẤM CÔNG (TIMESHEET) ---
  function renderTimesheet() {
    const tbody = document.getElementById('timesheet-tbody');
    let rows = '';

    USERS_DB.filter(u => u.status !== 'Đã nghỉ việc').forEach(u => {
      const days = appData.timesheet[u.id] || Array(31).fill('X');
      let cellsHtml = '';
      let totalX = 0, totalP = 0, totalO = 0;

      days.forEach((sym, dIdx) => {
        let cClass = 'cell-x';
        if (sym === 'P') { cClass = 'cell-p'; totalP++; }
        else if (sym === 'O') { cClass = 'cell-o'; totalO++; }
        else if (sym === 'CN') { cClass = 'cell-cn'; }
        else if (sym === 'T7') { cClass = 'cell-t7'; }
        else { totalX++; }

        const canEditAtt = (currentUser && (currentUser.role === 'hr' || currentUser.role === 'manager'));
        const clickAttr = canEditAtt
          ? `onclick="cycleAttendanceCell('${u.id}', ${dIdx + 1}, '${sym}')" title="Bấm để đổi ký hiệu công (X ➔ P ➔ O ➔ CN ➔ X)" style="cursor: pointer;"`
          : '';

        cellsHtml += `<td class="p-0 text-center border-r border-slate-100 matrix-cell ${cClass}" ${clickAttr}>${sym}</td>`;
      });

      const isMe = (currentUser && currentUser.id === u.id);
      rows += `
        <tr class="${isMe ? 'bg-blue-50/40 font-bold' : 'hover:bg-slate-50/80'} transition">
          <td class="py-2.5 px-3 font-bold sticky left-0 bg-white z-10 text-center border-r border-slate-200 text-slate-700">${u.id}</td>
          <td class="py-2.5 px-3 sticky left-[70px] bg-white z-10 border-r border-slate-200">
            <div class="font-bold text-slate-900">${u.name} ${isMe ? '<span class="text-[10px] text-blue-600">(Tôi)</span>' : ''}</div>
            <div class="text-[10px] text-slate-400">${u.title}</div>
          </td>
          <td class="py-2.5 px-2 text-center border-r border-slate-200"><span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-semibold text-[10px]">${u.dept}</span></td>
          ${cellsHtml}
          <td class="py-2.5 px-2 text-center font-extrabold text-blue-700 bg-blue-50/50">${totalX}</td>
          <td class="py-2.5 px-2 text-center font-bold text-indigo-700 bg-indigo-50/50">${totalP}</td>
          <td class="py-2.5 px-2 text-center font-bold text-amber-700 bg-amber-50/50">${totalO}</td>
        </tr>
      `;
    });
    tbody.innerHTML = rows;
  }

  function cycleAttendanceCell(empId, day, currentSym) {
    if (currentUser.role !== 'hr' && currentUser.role !== 'manager') return;
    const nextMap = { 'X': 'P', 'P': 'O', 'O': 'CN', 'CN': 'X', 'T7': 'X' };
    const nextSym = nextMap[currentSym] || 'X';

    // Cập nhật tạm thời trên UI
    if (appData.timesheet[empId]) {
      appData.timesheet[empId][day - 1] = nextSym;
      renderTimesheet();
    }

    callBackend('apiUpdateAttendanceCell', [empId, day, nextSym], (res) => {
      if (res && res.success) {
        showToast(res.message || `Đã cập nhật công ngày ${day} thành [${nextSym}]!`, 'success');
      } else {
        showToast((res && res.message) || 'Lỗi cập nhật bảng chấm công!', 'error');
        // Rollback nếu thất bại
        if (appData.timesheet[empId]) {
          appData.timesheet[empId][day - 1] = currentSym;
          renderTimesheet();
        }
      }
    }, (err) => {
      showToast('Lỗi máy chủ: ' + err.message, 'error');
      if (appData.timesheet[empId]) {
        appData.timesheet[empId][day - 1] = currentSym;
        renderTimesheet();
      }
    });
  }

  // --- RENDER 6: PAYROLL TABLE ---
  function renderPayrollTable() {
    const tbody = document.getElementById('payroll-tbody');
    const desc = document.getElementById('payroll-desc');
    const btnCalc = document.getElementById('btn-calc-payroll');

    if (currentUser.role === 'employee') {
      desc.innerText = 'Chế độ xem cá nhân: Chỉ hiển thị dữ liệu phiếu lương của bạn';
      if (btnCalc) btnCalc.classList.add('hidden');
    } else {
      desc.innerText = 'Chế độ quản trị: Bảng lương tổng hợp toàn bộ nhân sự công ty';
      if (btnCalc) btnCalc.classList.remove('hidden');
    }

    let html = '';
    const payrollList = (appData.payroll && appData.payroll.length > 0) ? appData.payroll : [];

    if (payrollList.length > 0) {
      payrollList.forEach(p => {
        if (currentUser.role === 'employee' && p.empId !== currentUser.id) return;
        html += `
          <tr class="hover:bg-slate-50 transition">
            <td class="py-3 px-4 font-bold text-slate-800">${p.empId}</td>
            <td class="py-3 px-4 font-semibold text-slate-900">${p.empName}</td>
            <td class="py-3 px-4 text-slate-600">${p.title || '---'}</td>
            <td class="py-3 px-4 text-right font-medium">${(p.baseSalary || 0).toLocaleString('vi-VN')} đ</td>
            <td class="py-3 px-3 text-center font-bold text-slate-500">${p.standardDays || 22}</td>
            <td class="py-3 px-3 text-center font-extrabold text-blue-600">${p.actualDays || 0}</td>
            <td class="py-3 px-4 text-right text-slate-600">${(p.allowance || 0).toLocaleString('vi-VN')} đ</td>
            <td class="py-3 px-4 text-right font-extrabold text-blue-700 text-sm">${(p.netSalary || 0).toLocaleString('vi-VN')} đ</td>
            <td class="py-3 px-4 text-center">
              <button onclick="printPayslip('${p.empId}')" class="px-2.5 py-1 bg-slate-100 hover:bg-blue-50 text-blue-600 hover:text-blue-700 rounded font-semibold text-[11px] border border-slate-200 transition">
                <i class="fa-solid fa-receipt mr-1"></i> Xem Phiếu Lương
              </button>
            </td>
          </tr>
        `;
      });
    } else {
      const workingDaysNorm = 22;
      USERS_DB.filter(u => u.status !== 'Đã nghỉ việc').forEach(u => {
        if (currentUser.role === 'employee' && u.id !== currentUser.id) return;

        const days = appData.timesheet[u.id] || [];
        const actualDays = days.filter(d => d === 'X').length;
        const allowance = 1500000;
        const salaryPerDay = (u.salary || 0) / workingDaysNorm;
        const gross = Math.round((salaryPerDay * actualDays) + allowance);
        const bhxh = Math.round((u.salary || 0) * 0.105);
        const netSalary = Math.max(0, gross - bhxh);

        html += `
          <tr class="hover:bg-slate-50 transition">
            <td class="py-3 px-4 font-bold text-slate-800">${u.id}</td>
            <td class="py-3 px-4 font-semibold text-slate-900">${u.name}</td>
            <td class="py-3 px-4 text-slate-600">${u.title}</td>
            <td class="py-3 px-4 text-right font-medium">${(u.salary || 0).toLocaleString('vi-VN')} đ</td>
            <td class="py-3 px-3 text-center font-bold text-slate-500">${workingDaysNorm}</td>
            <td class="py-3 px-3 text-center font-extrabold text-blue-600">${actualDays}</td>
            <td class="py-3 px-4 text-right text-slate-600">${allowance.toLocaleString('vi-VN')} đ</td>
            <td class="py-3 px-4 text-right font-extrabold text-blue-700 text-sm">${netSalary.toLocaleString('vi-VN')} đ</td>
            <td class="py-3 px-4 text-center">

                <i class="fa-solid fa-receipt mr-1"></i> Xem Phiếu Lương
              </button>
            </td>
          </tr>
        `;
      });
    }
    tbody.innerHTML = html;
  }

    const tbody = document.getElementById('docs-tbody');

      html += `

          <td class="py-3 px-4 font-bold text-slate-800">${d.id}</td>
          <td class="py-3 px-4 font-bold text-slate-900">${d.title}</td>
          <td class="py-3 px-4"><span class="px-2 py-0.5 rounded bg-amber-50 text-amber-800 font-medium">${d.type}</span></td>

      `;

  }

  // --- WORKFLOW ACTIONS ---
  function approveLeave(reqId) {
    const req = appData.leaveRequests.find(r => r.id === reqId);
    if (!req) return;

    callBackend('apiApproveLeave', [reqId, currentUser.name], (res) => {
      if (res && res.success) {
        req.status = 'APPROVED';
        if (!appData.timesheet[req.empId]) appData.timesheet[req.empId] = Array(31).fill('X');
        const fromDayNum = parseInt(req.from.split('-')[2]) - 1;
        for (let i = 0; i < req.days; i++) {
          if (fromDayNum + i < 31) appData.timesheet[req.empId][fromDayNum + i] = 'P';
        }
        showToast(res.message || `Đã duyệt đơn ${req.id} thành công!`, 'success');
        renderDashboard();
        renderLeaveTable();
        renderTimesheet();
      } else {
        showToast((res && res.message) || 'Phê duyệt đơn thất bại!', 'error');
      }
    }, (err) => {
      showToast('Lỗi máy chủ khi duyệt đơn: ' + err.message, 'error');
    });
  }

  function approveSick(sickId) {
    const sc = appData.sickCases.find(s => s.id === sickId);
    if (!sc) return;

    callBackend('apiApproveSick', [sickId, currentUser.name], (res) => {
      if (res && res.success) {
        sc.status = 'APPROVED';
        if (!appData.timesheet[sc.empId]) appData.timesheet[sc.empId] = Array(31).fill('X');
        const fromDayNum = parseInt(sc.from.split('-')[2]) - 1;
        for (let i = 0; i < sc.days; i++) {
          if (fromDayNum + i < 31) appData.timesheet[sc.empId][fromDayNum + i] = 'O';
        }
        showToast(res.message || `Đã xác nhận hồ sơ BHXH ${sc.id} thành công!`, 'success');
        renderDashboard();
        renderSickTable();
        renderTimesheet();
      } else {
        showToast((res && res.message) || 'Phê duyệt hồ sơ ốm đau thất bại!', 'error');
      }
    }, (err) => {
      showToast('Lỗi máy chủ khi duyệt hồ sơ: ' + err.message, 'error');
    });
  }

  function calculatePayroll() {
    if (!confirm('Hệ thống sẽ tổng hợp số ngày công từ bảng Chấm Công và tính lại Lương thực lĩnh cho toàn bộ nhân sự rồi lưu vào Google Sheet. Tiếp tục?')) return;
    showToast('Đang tính lương và đồng bộ Google Sheets...', 'info');

    callBackend('apiCalculateMonthlyPayroll', ['10/2026'], (res) => {
      if (res && res.success) {
        showToast(res.message || 'Đã tính toán và lưu Bảng Lương vào Google Sheet thành công!', 'success');
        callBackend('apiGetPayrollData', [currentUser.email], (pRes) => {
          if (pRes && pRes.success) {
            appData.payroll = pRes.data;
            renderPayrollTable();
          }
        });
      } else {
        showToast((res && res.message) || 'Tính lương thất bại!', 'error');
      }
    }, (err) => {
      showToast('Lỗi máy chủ khi tính lương: ' + err.message, 'error');
    });

  function handleCreateLeave(e) {
    e.preventDefault();
    const type = document.getElementById('leave-type').value;
    const days = parseInt(document.getElementById('leave-days').value) || 1;
    const from = document.getElementById('leave-from').value;
    const to = document.getElementById('leave-to').value;
    const reason = document.getElementById('leave-reason').value;

    const newId = 'LV-' + Math.floor(1000 + Math.random() * 9000);
    const leaveObj = {
      id: newId,
      empId: currentUser.id,
      empName: currentUser.name,
      type: type,
      from: from,
      to: to,
      days: days,
      reason: reason,
      status: 'PENDING'
    };

    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn ? submitBtn.innerHTML : '';
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Đang gửi đơn...';
    }

    callBackend('apiSubmitLeave', [leaveObj], (res) => {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
      if (res && res.success) {
        if (res.newId) leaveObj.id = res.newId;
        appData.leaveRequests.unshift(leaveObj);
        closeModal('modal-leave');
        showToast(res.message || `Nộp đơn ${leaveObj.id} thành công!`, 'success');
        renderDashboard();
        renderLeaveTable();
        switchTab('leave');
      } else {
        showToast((res && res.message) || 'Lỗi nộp đơn nghỉ phép!', 'error');
      }
    }, (err) => {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
      showToast('Lỗi kết nối máy chủ: ' + err.message, 'error');
    });
  }

  function handleCreateSick(e) {
    e.preventDefault();
    const hospital = document.getElementById('sick-hospital').value;
    const from = document.getElementById('sick-from').value;
    const to = document.getElementById('sick-to').value;

    let calcDays = 1;
    if (from && to) {
      const d1 = new Date(from);
      const d2 = new Date(to);
      if (!isNaN(d1.getTime()) && !isNaN(d2.getTime())) {
        calcDays = Math.max(1, Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1);
      }
    }

    const newId = 'SC-' + Math.floor(1000 + Math.random() * 9000);
    const sickObj = {
      id: newId,
      empId: currentUser.id,
      empName: currentUser.name,
      hospital: hospital,
      from: from,
      to: to,
      days: calcDays,
      status: 'PENDING'
    };

    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn ? submitBtn.innerHTML : '';
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Đang gửi hồ sơ...';
    }

    callBackend('apiSubmitSick', [sickObj], (res) => {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
      if (res && res.success) {
        if (res.newId) sickObj.id = res.newId;
        appData.sickCases.unshift(sickObj);
        closeModal('modal-sick');
        showToast(res.message || `Nộp hồ sơ ốm đau ${sickObj.id} (${calcDays} ngày) thành công!`, 'success');
        renderDashboard();
        renderSickTable();
        switchTab('sick');
      } else {
        showToast((res && res.message) || 'Lỗi nộp hồ sơ ốm đau!', 'error');
      }
    }, (err) => {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
      showToast('Lỗi kết nối máy chủ: ' + err.message, 'error');
    });
  }

  function handleSaveTask(e) {
    e.preventDefault();
    const title = document.getElementById('task-form-title').value.trim();
    const type = document.getElementById('task-form-type').value;
    const assignee = document.getElementById('task-form-assignee').value;
    const deadline = document.getElementById('task-form-deadline').value;
    const note = document.getElementById('task-form-note').value;
    const newId = 'CV-' + Math.floor(100 + Math.random() * 900);

    const taskObj = {
      id: newId,
      title: title,
      type: type,
      assigner: currentUser.name,
      assignee: assignee,
      deadline: deadline,
      status: 'Đang xử lý',
      note: note
    };

    appData.tasks.unshift(taskObj);
    closeModal('modal-task');
    renderTasksTable();
    renderDashboard();
    switchTab('tasks');

    callBackend('apiSaveTask', [taskObj], (res) => {
      if (res && res.success) {
        showToast(`Giao việc [${newId}] cho ${assignee} thành công (Đã lưu Sheet)!`, 'success');
      } else {
        appData.tasks = appData.tasks.filter(x => x.id !== newId);
        renderTasksTable();
        renderDashboard();
        showToast((res && res.message) || 'Lưu công việc thất bại!', 'error');
      }
    }, (err) => {
      appData.tasks = appData.tasks.filter(x => x.id !== newId);
      renderTasksTable();
      renderDashboard();
      showToast('Lỗi máy chủ khi lưu công việc: ' + err.message, 'error');
    });
  }

  function markTaskDone(taskId) {
    const t = appData.tasks.find(x => x.id === taskId);
    if (!t) return;
    const prevStatus = t.status;
    t.status = 'Hoàn thành';
    renderTasksTable();
    renderDashboard();

    callBackend('apiUpdateTaskStatus', [taskId, 'Hoàn thành'], (res) => {
      if (res && res.success) {
        showToast(`Đã xác nhận hoàn thành công việc [${taskId}] (Đã cập nhật Sheet)!`, 'success');
      } else {
        t.status = prevStatus;
        renderTasksTable();
        renderDashboard();
        showToast((res && res.message) || 'Cập nhật trạng thái thất bại!', 'error');
      }
    }, (err) => {
      t.status = prevStatus;
      renderTasksTable();
      renderDashboard();
      showToast('Lỗi máy chủ: ' + err.message, 'error');
    });
  }

  function handleSaveDoc(e) {
    e.preventDefault();
    const id = document.getElementById('doc-form-id').value.trim();
    const type = document.getElementById('doc-form-type').value;
    const title = document.getElementById('doc-form-title').value.trim();
    const issuer = document.getElementById('doc-form-issuer').value.trim();
    const url = document.getElementById('doc-form-url').value.trim();

    const docObj = {
      id: id,
      title: title,
      type: type,
      issuer: issuer,
      date: UtilitiesFormatToday(),
      fileUrl: url,
      status: 'Hiệu lực'
    };

    appData.documents.unshift(docObj);
    closeModal('modal-doc');
    renderDocsTable();
    switchTab('docs');

    callBackend('apiSaveDocument', [docObj], (res) => {
      if (res && res.success) {
        showToast(`Lưu trữ văn bản [${id}] thành công (Đã lưu Sheet)!`, 'success');
      } else {
        appData.documents = appData.documents.filter(x => x.id !== id);
        renderDocsTable();
        showToast((res && res.message) || 'Lưu văn bản thất bại!', 'error');
      }
    }, (err) => {
      appData.documents = appData.documents.filter(x => x.id !== id);
      renderDocsTable();
      showToast('Lỗi máy chủ khi lưu văn bản: ' + err.message, 'error');
    });
  }

  function UtilitiesFormatToday() {
    const d = new Date();
    return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
  }

  function printPayslip(empId) {
    const u = USERS_DB.find(x => x.id === empId) || USERS_DB[0];
    const payrollItem = (appData.payroll && appData.payroll.length)
      ? appData.payroll.find(p => p.empId === empId)
      : null;

    const days = appData.timesheet[u.id] || [];
    const leaveDays = days.filter(d => d === 'P').length;

    const baseSalary = payrollItem ? payrollItem.baseSalary : (u.salary || 0);
    const standardDays = payrollItem ? payrollItem.standardDays : 22;
    const actualDays = payrollItem ? payrollItem.actualDays : days.filter(d => d === 'X').length;
    const allowance = payrollItem ? payrollItem.allowance : 1500000;
    const bhxh = payrollItem ? payrollItem.bhxh : Math.round(baseSalary * 0.105);
    const salaryPerDay = standardDays > 0 ? (baseSalary / standardDays) : 0;
    const salaryByDays = Math.round(salaryPerDay * actualDays);
    const net = payrollItem ? payrollItem.netSalary : Math.max(0, salaryByDays + allowance - bhxh);

    document.getElementById('payslip-content').innerHTML = `
      <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 grid grid-cols-2 gap-2 text-slate-700">
        <div><strong>Mã NV:</strong> ${u.id}</div>
        <div><strong>Họ và tên:</strong> ${u.name}</div>
        <div><strong>Phòng ban:</strong> ${u.dept}</div>
        <div><strong>Chức danh:</strong> ${u.title}</div>
      </div>
      <div class="border border-slate-200 rounded-xl overflow-hidden mt-3">
        <table class="w-full text-left">
          <tbody class="divide-y divide-slate-100">
            <tr class="bg-slate-50/50"><td class="p-2 font-semibold">1. Lương cơ bản theo hợp đồng:</td><td class="p-2 text-right font-bold">${baseSalary.toLocaleString('vi-VN')} đ</td></tr>
            <tr><td class="p-2">2. Ngày công chuẩn trong tháng:</td><td class="p-2 text-right">${standardDays} ngày</td></tr>
            <tr><td class="p-2">3. Số ngày làm việc thực tế:</td><td class="p-2 text-right font-bold text-blue-600">${actualDays} ngày (Phép: ${leaveDays} ngày)</td></tr>
            <tr><td class="p-2">4. Lương theo ngày công:</td><td class="p-2 text-right">${salaryByDays.toLocaleString('vi-VN')} đ</td></tr>
            <tr><td class="p-2">5. Phụ cấp trách nhiệm & ăn trưa:</td><td class="p-2 text-right">${allowance.toLocaleString('vi-VN')} đ</td></tr>
            <tr class="text-rose-600"><td class="p-2">6. Khấu trừ BHXH (10.5%):</td><td class="p-2 text-right font-medium">-${bhxh.toLocaleString('vi-VN')} đ</td></tr>
            <tr class="bg-blue-50 text-blue-900 font-bold text-sm"><td class="p-3">THỰC LĨNH CHUYỂN KHOẢN:</td><td class="p-3 text-right text-base font-extrabold text-blue-700">${net.toLocaleString('vi-VN')} đ</td></tr>
          </tbody>
        </table>
      </div>
    `;
    document.getElementById('modal-payslip').classList.remove('hidden');
  }

  function populateAssigneeSelect() {
    const select = document.getElementById('task-form-assignee');
    if (!select) return;
    select.innerHTML = USERS_DB.map(u => `<option value="${u.name}">${u.name} (${u.dept})</option>`).join('');
  }

  function openLeaveModal() {
    document.getElementById('leave-emp-name').value = `${currentUser.id} - ${currentUser.name} (${currentUser.dept})`;
    document.getElementById('modal-leave').classList.remove('hidden');
  }
  function openSickModal() {
    document.getElementById('modal-sick').classList.remove('hidden');
  }
  function openTaskModal() {
    document.getElementById('modal-task').classList.remove('hidden');
  }
  function openDocModal() {
    document.getElementById('modal-doc').classList.remove('hidden');
  }
  function closeModal(id) {
    document.getElementById(id).classList.add('hidden');
  }

  let toastTimer;
  function showToast(msg, type = 'success') {
    clearTimeout(toastTimer);
    const toast = document.getElementById('toast');
    document.getElementById('toast-msg').innerText = msg;
    toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
    toastTimer = setTimeout(() => {
      toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
    }, 4000);
  }

  function initApp() {
    renderDashboard();
    renderEmployees();
    renderTimesheet();
    renderLeaveTable();
    renderSickTable();
    renderPayrollTable();
    renderTasksTable();
    renderDocsTable();
  }
</script>
