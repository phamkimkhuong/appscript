<script>
  //# sourceURL=scripts.js
  // Initial in-memory data store (hoạt động song song với Google Sheets)
  let USERS_DB = [];
  const emptyAppData = () => ({ timesheet: {}, timesheetByPeriod: {}, attendanceCutoff: 0, attendanceAsOf: '', plannedTimesheet: {}, leaveRequests: [], sickCases: [], tasks: [], documents: [], payroll: [] });
  let appData = emptyAppData();
  let authToken = '';
  let loadingData = false;
  let requestVersion = 0;
  let authGeneration = 0;
  let loginPending = false;
  let busyActions = new Set();
  let currentUser = null;
  let currentTimesheetPeriod = '10/2026';
  let currentPayrollPeriod = '';
  let payrollPeriods = [];

  // --- XSS SANITIZER HELPER ---
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // --- CALL BACKEND BRIDGE ---
  function callBackend(fnName, args, callback, errorCallback) {
    const generation = authGeneration;
    const mutating = !['apiLogin', 'apiGetInitialAppData', 'apiGetAttendance', 'apiGetPayrollData', 'apiReadAttachment'].includes(fnName);
    if (mutating && busyActions.has(fnName)) { showToast('Thao tác đang được xử lý.', 'info'); return; }
    if (mutating) busyActions.add(fnName);
    const done = res => {
      if (generation !== authGeneration) return;
      busyActions.delete(fnName);
      if (fnName === 'apiLogin' && res && res.success) {
        authToken = res.token;
      }
      if (callback) callback(res);
      if (mutating && res && res.success) refreshAppData();
    };
    const failed = err => { if (generation !== authGeneration) return; busyActions.delete(fnName); if (errorCallback) errorCallback(err); else showToast(err.message || String(err), 'error'); };
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      const runner = google.script.run.withSuccessHandler(done).withFailureHandler(failed);
      if (fnName === 'apiLogin') runner.apiLogin(args[0], args[1]);
      else runner.apiRequest(authToken, fnName, args || []);
    } else if (typeof window.localDemoRequest === 'function') {
      Promise.resolve().then(() => window.localDemoRequest(fnName, args || [], authToken)).then(done).catch(failed);
    } else failed(new Error('Hãy mở bản preview được tạo bởi npm run build:preview hoặc bản Apps Script.'));
  }

  // --- AUTH LOGIC ---
  function handleLoginSubmit(e) {
    if (e) e.preventDefault();
    if (loginPending) return;
    const email = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;

    if (!email) {
      showToast('Vui lòng nhập địa chỉ email!', 'error');
      return;
    }

    const submitBtn = document.querySelector('#screen-login form button[type="submit"]');
    const originalText = submitBtn ? submitBtn.innerHTML : '';
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Đang đăng nhập...';
    }

    const status = document.getElementById('login-status');
    if (status) status.textContent = 'Đang kiểm tra tài khoản...';
    const waitTimer = setTimeout(() => {
      if (loginPending && status) status.textContent = 'Máy chủ đang xử lý, vui lòng đợi trong giây lát...';
    }, 5000);
    const finishLogin = () => {
      clearTimeout(waitTimer);
      loginPending = false;
      if (status) status.textContent = '';
      if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = originalText; }
    };
    loginPending = true;
    callBackend('apiLogin', [email, password], (res) => {
      finishLogin();
      if (res && res.success && res.profile) {
        loginAsUser(res.profile);
        showToast(`Đăng nhập thành công! Xin chào ${res.profile.name}.`, 'success');
      } else {
        const msg = (res && res.message) ? res.message : 'Đăng nhập thất bại! Kiểm tra email hoặc mật khẩu.';
        showToast(msg, 'error');
      }
    }, (err) => {
      finishLogin();
      showToast('Lỗi kết nối máy chủ xác thực: ' + err.message, 'error');
    });
  }

  function fillAndLogin(email) {
    document.getElementById('login-username').value = email;
    document.getElementById('login-password').value = '123456';
    handleLoginSubmit(null);
  }

  // Gắn tường minh vào window để mọi chế độ iframe/sandbox đều gọi được từ inline onsubmit
  if (typeof window !== 'undefined') {
    window.handleLoginSubmit = handleLoginSubmit;
    window.fillAndLogin = fillAndLogin;
  }

  function loginAsUser(user) {
    currentUser = user;
    currentPayrollPeriod = ''; payrollPeriods = [];
    appData = emptyAppData(); USERS_DB = []; currentPayslipEmpId = null;
    initApp(); applyRoleControls();
    switchTab('dashboard');
    document.getElementById('screen-login').classList.add('hidden');
    document.getElementById('screen-app').classList.remove('hidden');

    // Update Header
    document.getElementById('user-name').innerText = user.name;
    document.getElementById('user-role-label').innerText = `${user.title} (${user.dept})`;
    document.getElementById('user-avatar').src = user.avatar || 'https:\u002f\u002fimages.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces';
    document.getElementById('greet-name').innerText = user.name;
    document.getElementById('greet-badge').innerText = user.role === 'employee' ? 'Nhân Viên' : user.role === 'manager' ? 'Quản Lý / Trưởng Phòng' : 'Kế Toán';

    // Phân quyền hiển thị nút Thêm Nhân Viên
    const addEmpBtn = document.getElementById('btn-add-employee');
    if (addEmpBtn) {
      if (user.role !== 'manager') {
        addEmpBtn.classList.add('hidden');
      } else {
        addEmpBtn.classList.remove('hidden');
      }
    }

    // Populate Assignee Select in Task Modal
    populateAssigneeSelect();

    appData = emptyAppData(); USERS_DB = [];
    refreshAppData();
  }

  function handleLogout() {
    const token = authToken;
    if (typeof google !== 'undefined' && google.script) google.script.run.apiLogout(token);
    else if (window.localDemoLogout) window.localDemoLogout(token);
    authGeneration++; busyActions.clear(); loadingData = false;
    authToken = ''; currentUser = null; appData = emptyAppData(); USERS_DB = []; requestVersion++;
    document.getElementById('screen-app').classList.add('hidden');
    document.getElementById('screen-login').classList.remove('hidden');
    const uInput = document.getElementById('login-username');
    if (uInput) uInput.value = '';
    const pInput = document.getElementById('login-password');
    if (pInput) pInput.value = '';
    switchTab('dashboard');
    document.querySelectorAll('[id^="modal-"]').forEach(el => el.classList.add('hidden'));
    showToast('Đã đăng xuất thành công.');
  }

  // --- TAB NAVIGATION ---
  function switchTab(tabId) {
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.add('hidden'));
    document.querySelectorAll('.nav-tab').forEach(t => {
      t.className = 'nav-tab px-3.5 py-2 rounded-lg text-sm font-semibold flex items-center space-x-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 whitespace-nowrap shrink-0 transition';
    });

    const pane = document.getElementById(`pane-${tabId}`);
    if (pane) pane.classList.remove('hidden');

    const btn = document.getElementById(`tab-btn-${tabId}`);
    if (btn) btn.className = 'nav-tab active px-3.5 py-2 rounded-lg text-sm font-semibold flex items-center space-x-2 text-blue-600 bg-blue-50 whitespace-nowrap shrink-0 transition';

    if (!currentUser) return;
    if (tabId === 'dashboard') renderDashboard();
    if (tabId === 'employees') renderEmployees();
    if (tabId === 'timesheet') renderTimesheet();
    if (tabId === 'leave') renderLeaveTable();
    if (tabId === 'sick') renderSickTable();
    if (tabId === 'payroll') renderPayrollTable();
    if (tabId === 'tasks') renderTasksTable();
    if (tabId === 'docs') renderDocsTable();
    applyRoleControls();
  }

  // --- RENDER 1: DASHBOARD ---
  function renderDashboard() {
    const pList = document.getElementById('dash-pending-list');
    const badgeLeave = document.getElementById('leave-pending-badge');
    const badgeSick = document.getElementById('sick-pending-badge');
    const kpiPending = document.getElementById('kpi-pending-total');
    const roleNotice = document.getElementById('role-notice');
    const kpiTotal = document.getElementById('kpi-total-emp');
    const kpiTotalSub = document.getElementById('kpi-total-emp-sub');
    const kpiPayroll = document.getElementById('kpi-payroll-total');

    const kpiActiveTasks = document.getElementById('kpi-active-tasks');

    const active = USERS_DB.filter(u => u.status !== 'Đã nghỉ việc');
    kpiTotal.innerText = active.length;
    const visible = currentUser.role === 'employee' ? active.filter(u => u.id === currentUser.id) : active;
    kpiTotalSub.innerText = visible.length;
    const now = new Date(), todayPeriod = String(now.getMonth() + 1).padStart(2, '0') + '/' + now.getFullYear();
    const map = appData.timesheetByPeriod[currentTimesheetPeriod] || {};
    const working = visible.filter(u => ['X', 'OT'].includes((map[u.id] || [])[now.getDate() - 1])).length;
    document.getElementById('kpi-working-today').innerText = currentTimesheetPeriod === todayPeriod ? working : '—';
    document.getElementById('kpi-attendance-rate').innerText = currentTimesheetPeriod === todayPeriod && visible.length ? 'Tỷ lệ đi làm: ' + Math.round(working / visible.length * 100) + '%' : 'Chọn kỳ hiện tại để xem hôm nay';
    const periodPayroll = appData.payroll.filter(p => p.period === currentPayrollPeriod);
    if (kpiPayroll) kpiPayroll.innerText = periodPayroll.length ? money(periodPayroll.reduce((sum, p) => sum + p.netSalary, 0)) : 'Chưa tính';
    document.getElementById('kpi-payroll-status').innerText = (currentPayrollPeriod ? 'Kỳ ' + currentPayrollPeriod : 'Đang tải kỳ lương') + (periodPayroll.some(p => p.status === 'Cần tính lại') ? ' • Cần tính lại' : '');
    document.getElementById('kpi-payroll-label').innerText = currentUser.role === 'employee' ? 'Lương của tôi' : 'Quỹ lương';
    kpiActiveTasks.innerText = appData.tasks.filter(t => t.status !== 'Hoàn thành').length;
    document.getElementById('kpi-pending-docs').innerText = new Set(appData.tasks.filter(t => t.docId && t.status !== 'Hoàn thành').map(t => t.docId)).size;
    let pendings = [];

    // Lọc đơn nghỉ phép theo quyền hạn bảo mật
    appData.leaveRequests.filter(r => r.status === 'PENDING').forEach(r => {
      // Nhân viên chỉ thấy đơn của chính mình
      if (currentUser.role === 'employee' && r.empId !== currentUser.id) return;

      pendings.push({
        type: 'leave',
        id: r.id,
        title: `Đơn xin nghỉ phép (${escapeHtml(r.type)} - ${r.days} ngày)`,
        sub: `${escapeHtml(r.empName)} • Từ ${escapeHtml(r.from)} đến ${escapeHtml(r.to)} • Lý do: "${escapeHtml(r.reason)}"`,
        canApprove: (currentUser.role === 'manager'),
        roleReq: currentUser.role !== 'manager' ? 'Đang chờ Quản lý duyệt' : 'Quản lý duyệt'
      });
    });

    // Lọc hồ sơ ốm đau theo quyền hạn bảo mật và trạng thái PENDING hoặc NEED_MORE_INFO
    appData.sickCases.filter(s => s.status === 'PENDING' || s.status === 'NEED_MORE_INFO').forEach(s => {
      // Nhân viên chỉ thấy hồ sơ ốm đau của chính mình (bảo mật thông tin y tế)
      if (currentUser.role === 'employee' && s.empId !== currentUser.id) return;

      const isNeedInfo = (s.status === 'NEED_MORE_INFO');
      let title = `Hồ sơ nghỉ ốm hưởng BHXH (${s.days} ngày)`;
      let sub = `${escapeHtml(s.empName)} • ${escapeHtml(s.hospital)} • Từ ${escapeHtml(s.from)} đến ${escapeHtml(s.to)}`;
      if (isNeedInfo) {
        if (s.empId === currentUser.id) {
          title = `Hồ sơ cần bổ sung chứng từ y tế (${s.id})`;
          sub = `Quản lý yêu cầu bổ sung: "${escapeHtml(s.note || 'Cần nộp lại chứng từ/hóa đơn y tế hợp lệ')}"`;
        } else {
          title = `Hồ sơ ốm đau [Yêu cầu bổ sung] (${s.id})`;
          sub = `${escapeHtml(s.empName)} • Đang chờ NV bổ sung chứng từ • Ghi chú: "${escapeHtml(s.note || '')}"`;
        }
      }

      pendings.push({
        type: 'sick',
        id: s.id,
        status: s.status,
        title: title,
        sub: sub,
        isNeedInfo: isNeedInfo,
        canApprove: (currentUser.role === 'manager'),
        canResubmit: (s.empId === currentUser.id && isNeedInfo),
        roleReq: isNeedInfo
          ? (s.empId === currentUser.id ? 'Cần bạn nộp lại' : 'Chờ nhân viên bổ sung')
          : (currentUser.role === 'employee' ? 'Đang chờ Quản lý duyệt hồ sơ' : 'Quản lý duyệt')
      });
    });

    kpiPending.innerText = pendings.length;

    // Cập nhật Badge trên thanh Menu Tab theo quyền
    const leavesPendingCount = appData.leaveRequests.filter(r => r.status === 'PENDING' && (currentUser.role !== 'employee' || r.empId === currentUser.id)).length;
    const sickPendingCount = appData.sickCases.filter(s => (s.status === 'PENDING' || (s.empId === currentUser.id && s.status === 'NEED_MORE_INFO')) && (currentUser.role !== 'employee' || s.empId === currentUser.id)).length;

    if (leavesPendingCount > 0) {
      badgeLeave.innerText = leavesPendingCount;
      badgeLeave.classList.remove('hidden');
    } else {
      badgeLeave.classList.add('hidden');
    }

    if (sickPendingCount > 0) {
      badgeSick.innerText = sickPendingCount;
      badgeSick.classList.remove('hidden');
    } else {
      badgeSick.classList.add('hidden');
    }

    if (currentUser.role === 'employee') {
      roleNotice.innerText = 'Chế độ cá nhân: Theo dõi tiến độ phê duyệt hồ sơ của bạn';
    } else if (currentUser.role === 'manager') {
      roleNotice.innerText = 'Quản lý: Quản lý nhân sự, duyệt nghỉ phép/ốm đau và giao việc';
    } else {
      roleNotice.innerText = 'Kế toán: Đối chiếu bảng công, tính lương và quản lý văn bản lương';
    }

    if (pendings.length === 0) {
      pList.innerHTML = `
        <div class="text-center py-10 text-slate-400">
          <i class="fa-solid fa-circle-check text-emerald-500 text-3xl mb-2.5"></i>
          <p class="text-xs sm:text-sm font-medium text-slate-600">
            ${currentUser.role === 'employee'
          ? 'Bạn hiện không có đơn nào đang chờ xử lý. Tất cả quy trình đã hoàn tất!'
          : 'Hiện tại không có đơn nào đang chờ xử lý. Tất cả quy trình đã hoàn tất!'}
          </p>
        </div>
      `;
      return;
    }

    let html = '';
    pendings.forEach(p => {
      let actionBtn = '';
      if (p.canResubmit) {
        actionBtn = `
          <button onclick="openSickResubmitModal('${p.id}')" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-xs font-bold shadow-sm transition flex items-center space-x-1">
            <i class="fa-solid fa-upload mr-1"></i><span>Bổ sung hồ sơ</span>
          </button>`;
      } else if (p.canApprove) {
        if (p.type === 'leave') {
          actionBtn = `
            <div class="flex items-center space-x-1.5">
              <button onclick="approveLeave('${p.id}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold shadow-sm transition flex items-center space-x-1"><i class="fa-solid fa-check mr-1"></i><span>Duyệt</span></button>
              <button onclick="rejectLeave('${p.id}')" class="px-2.5 py-1.5 bg-rose-100 hover:bg-rose-200 text-rose-700 rounded-lg text-xs font-bold transition flex items-center space-x-1"><i class="fa-solid fa-xmark"></i></button>
            </div>`;
        } else {
          actionBtn = `
            <div class="flex items-center space-x-1.5">
              <button onclick="approveSick('${p.id}')" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold shadow-sm transition flex items-center space-x-1"><i class="fa-solid fa-check mr-1"></i><span>Duyệt</span></button>
              <button onclick="openSickMoreInfoModal('${p.id}')" class="px-2.5 py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-xs font-bold shadow-sm transition flex items-center space-x-1" title="Yêu cầu bổ sung chứng từ"><i class="fa-solid fa-triangle-exclamation mr-1"></i><span>Bổ sung</span></button>
              <button onclick="rejectSick('${p.id}')" class="px-2 py-1.5 bg-rose-100 hover:bg-rose-200 text-rose-700 rounded-lg text-xs font-bold transition flex items-center space-x-1"><i class="fa-solid fa-xmark"></i></button>
            </div>`;
        }
      } else {
        actionBtn = `<span class="text-xs px-3 py-1.5 rounded-full ${p.isNeedInfo ? 'bg-amber-100 text-amber-800 border border-amber-300' : 'bg-amber-50 text-amber-700 border border-amber-200/80'} font-semibold flex items-center space-x-1"><i class="fa-solid fa-clock"></i><span>${p.roleReq}</span></span>`;
      }

      html += `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-slate-50/70 hover:bg-slate-100/80 rounded-2xl border border-slate-200/80 transition duration-150 gap-3">
          <div class="flex items-center space-x-3.5">
            <div class="w-10 h-10 rounded-xl ${p.type === 'leave' ? 'bg-amber-100 text-amber-700' : p.isNeedInfo ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-700'} flex items-center justify-center text-base font-bold shrink-0 shadow-sm">
              <i class="${p.type === 'leave' ? 'fa-solid fa-file-pen' : p.isNeedInfo ? 'fa-solid fa-triangle-exclamation' : 'fa-solid fa-heart-pulse'}"></i>
            </div>
            <div>
              <div class="text-sm font-bold text-slate-900">${p.title}</div>
              <div class="text-xs text-slate-500 mt-0.5">${p.sub}</div>
            </div>
          </div>
          <div class="self-end sm:self-center shrink-0">${actionBtn}</div>
        </div>
      `;
    });
    pList.innerHTML = html;
  }

  // --- RENDER 2: QUẢN LÝ NHÂN SỰ (EMPLOYEES) ---
  function renderEmployees() {
    const tbody = document.getElementById('employees-tbody');
    const deptFilter = document.getElementById('emp-filter-dept').value;
    const statusFilter = document.getElementById('emp-filter-status').value;
    const query = (document.getElementById('emp-search-input').value || '').trim().toLowerCase();

    let filtered = USERS_DB.filter(u => {
      if (deptFilter !== 'all' && u.dept !== deptFilter) return false;
      if (statusFilter !== 'all' && u.status !== statusFilter) return false;
      if (query) {
        const matchName = u.name.toLowerCase().includes(query);
        const matchId = u.id.toLowerCase().includes(query);
        const matchEmail = (u.email || '').toLowerCase().includes(query);
        if (!matchName && !matchId && !matchEmail) return false;
      }
      return true;
    });

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="9" class="text-center py-6 text-slate-400">Không tìm thấy nhân sự phù hợp</td></tr>`;
      return;
    }

    let html = '';
    filtered.forEach(u => {
      const canEdit = (currentUser.role === 'manager');
      const titleBadge = u.title === 'Quản lý'
        ? `<span class="px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 font-bold text-[10px]">Quản lý</span>`
        : u.title === 'Kế toán'
          ? `<span class="px-2.5 py-0.5 rounded-full bg-purple-100 text-purple-800 font-bold text-[10px]">Kế toán</span>`
          : `<span class="px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700 font-medium text-[10px]">Nhân viên</span>`;

      const statusBadge = u.status === 'Đang làm việc'
        ? `<span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 font-semibold text-[10px]">Đang làm việc</span>`
        : `<span class="px-2 py-0.5 rounded-full bg-rose-100 text-rose-800 font-semibold text-[10px]">Đã nghỉ việc</span>`;

      // Bảo mật mức lương
      let salaryText = '•••••••• đ';
      if (currentUser.role === 'manager' || currentUser.id === u.id) {
        salaryText = (u.salary || 0).toLocaleString('vi-VN') + ' đ';
      }

      let actionHtml = '---';
      if (canEdit) {
        actionHtml = `
          <div class="flex items-center justify-end space-x-1.5">
            <button onclick="editEmployee('${u.id}')" title="Sửa thông tin" class="p-1.5 bg-slate-100 hover:bg-blue-100 text-slate-600 hover:text-blue-700 rounded-lg transition"><i class="fa-solid fa-pen-to-square"></i></button>
            <button onclick="deleteEmployee('${u.id}')" title="Khóa/Nghỉ việc" class="p-1.5 bg-slate-100 hover:bg-rose-100 text-slate-600 hover:text-rose-700 rounded-lg transition"><i class="fa-solid fa-user-slash"></i></button>
          </div>
        `;
      }

      const defaultAvatar = 'https:\u002f\u002fimages.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces';
      html += `
        <tr class="hover:bg-slate-50 transition">
          <td class="py-3 px-4 font-bold text-slate-800">${escapeHtml(u.id)}</td>
          <td class="py-3 px-4">
            <div class="flex items-center space-x-2.5">
              <img src="${escapeHtml(u.avatar || defaultAvatar)}" class="w-7 h-7 rounded-full object-cover border border-slate-200">
              <div>
                <div class="font-bold text-slate-900">${escapeHtml(u.name)}</div>
                <div class="text-[10px] text-slate-400">${escapeHtml(u.email)}</div>
              </div>
            </div>
          </td>
          <td class="py-3 px-4"><span class="px-2 py-0.5 rounded bg-blue-50 text-blue-700 font-medium">${escapeHtml(u.dept)}</span></td>
          <td class="py-3 px-4">${titleBadge}</td>
          <td class="py-3 px-4 text-right font-semibold text-slate-900">${salaryText}</td>
          <td class="py-3 px-4 text-center">${statusBadge}</td>
          <td class="py-3 px-4 text-center text-slate-500">${escapeHtml(u.startDate || '--')}</td>
          <td class="py-3 px-4 text-right">${actionHtml}</td>
        </tr>
      `;
    });
    tbody.innerHTML = html;
  }

  function filterEmployees() {
    renderEmployees();
  }

  function openEmployeeModal() {

  // --- RENDER 3: BẢNG CHẤM CÔNG ĐA KỲ (TIMESHEET MULTI-PERIOD) ---
  function getDaysInMonth(month, year) {
    return new Date(year, month, 0).getDate();
  }

  function generateDefaultDaysForMonth(period) {
    const parts = (period || '10/2026').split('/');
    const month = parseInt(parts[0], 10) || 10;
    const year = parseInt(parts[1], 10) || 2026;
    const totalDays = getDaysInMonth(month, year);
    const days = Array(31).fill('');
    let standardWorkingDays = 0;

    for (let d = 1; d <= 31; d++) {
      if (d <= totalDays) {
        const dt = new Date(year, month - 1, d);
        const dow = dt.getDay(); // 0: CN, 6: T7
        if (dow === 0) {
          days[d - 1] = 'CN';
        } else if (dow === 6) {
          days[d - 1] = 'T7';
        } else {
          days[d - 1] = '';
          standardWorkingDays++;
        }
      } else {
        days[d - 1] = '';
      }
    }
    return { days, daysInMonth: totalDays, standardWorkingDays };
  }

    const totalDays = getDaysInMonth(month, year);

    // Cập nhật badge số ngày & công chuẩn
    const info = generateDefaultDaysForMonth(period);
    const badge = document.getElementById('timesheet-days-badge');
    if (badge) {
      badge.innerText = `${totalDays} ngày (${info.standardWorkingDays} công chuẩn)`;
      document.getElementById("timesheet-cutoff-note").innerText = `Công ghi nhận đến ${appData.attendanceAsOf || "—"}. Ô mờ là ngày chưa đến; dấu * là lịch nghỉ dự kiến, chưa cộng vào tổng công.`;
    }

    let thHtml = `
      <th class="py-3 px-2 font-semibold sticky left-0 bg-slate-900 z-30 min-w-[65px] text-center border-r border-slate-800">Mã NV</th>

    for (let d = 1; d <= totalDays; d++) {
      const dt = new Date(year, month - 1, d);

      <th class="py-3 px-2 font-bold text-center bg-amber-900 text-white min-w-[55px]">Ốm (O)</th>
      <th class="py-3 px-2 font-bold text-center bg-rose-900 text-white min-w-[55px]">Không lương (K)</th>
      <th class="py-3 px-2 font-bold text-center bg-purple-900 text-white min-w-[55px]">OT</th>
    `;
    tr.innerHTML = thHtml;

    const calendar = generateDefaultDaysForMonth(currentTimesheetPeriod).days;

          : (future ? 'title="Chưa đến ngày; dấu * là lịch nghỉ dự kiến, chưa cộng công"' : '');

        cellsHtml += `<td class="p-0 text-center border-r border-slate-100 matrix-cell ${cClass}" ${clickAttr}>${display}</td>`;

  function prevTimesheetPeriod() {
    const parts = currentTimesheetPeriod.split('/');
    let m = parseInt(parts[0], 10);
    let y = parseInt(parts[1], 10);
    m--;
    if (m < 1) { m = 12; y--; }
    const newPeriod = `${String(m).padStart(2, '0')}/${y}`;
    changeTimesheetPeriod(newPeriod);
  }

  function nextTimesheetPeriod() {
    const parts = currentTimesheetPeriod.split('/');
    let m = parseInt(parts[0], 10);
    let y = parseInt(parts[1], 10);
    m++;
    if (m > 12) { m = 1; y++; }
    const newPeriod = `${String(m).padStart(2, '0')}/${y}`;
    changeTimesheetPeriod(newPeriod);
  }

  function cycleAttendanceCell(empId, day, currentSym) {
    if (loadingData || busyActions.has('apiUpdateAttendanceCell')) return;
    if (currentUser.role !== 'manager' || day > appData.attendanceCutoff) return;
    const nextMap = { 'X': 'OT', 'OT': 'P', 'P': 'K', 'K': 'O', 'O': 'CN', 'CN': 'X', 'T7': 'OT' };
    const nextSym = nextMap[currentSym] || 'X';

    const period = currentTimesheetPeriod;
    if (!appData.timesheetByPeriod) appData.timesheetByPeriod = {};
    if (!appData.timesheetByPeriod[period]) {
      appData.timesheetByPeriod[period] = appData.timesheet || {};
    }
    if (appData.timesheetByPeriod[period][empId]) {
      appData.timesheetByPeriod[period][empId][day - 1] = nextSym;
      renderTimesheet();
    }

    const callerEmail = currentUser ? currentUser.email : '';
    callBackend('apiUpdateAttendanceCell', [empId, day, nextSym, callerEmail, period], (res) => {
      if (res && res.success) {
        showToast(res.message || `Đã cập nhật công ngày ${day} (${period}) thành [${nextSym}]!`, 'success');
      } else {
        showToast((res && res.message) || 'Lỗi cập nhật bảng chấm công!', 'error');
        // Rollback nếu thất bại
        if (appData.timesheetByPeriod[period] && appData.timesheetByPeriod[period][empId]) {
          appData.timesheetByPeriod[period][empId][day - 1] = currentSym;
          renderTimesheet();
        }
      }
    }, (err) => {
      showToast('Lỗi máy chủ: ' + err.message, 'error');
      if (appData.timesheetByPeriod[period] && appData.timesheetByPeriod[period][empId]) {
        appData.timesheetByPeriod[period][empId][day - 1] = currentSym;
        renderTimesheet();
      }
    });
  }

  // Minimal OOXML workbook in an uncompressed ZIP; text uses inline strings, never formulas.
  function createExcelWorkbook(rows) {

      '_rels/.rels': '<Relationships xmlns="http:\u002f\u002fschemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http:\u002f\u002fschemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
      'xl/workbook.xml': '<workbook xmlns="http:\u002f\u002fschemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http:\u002f\u002fschemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="ChamCong" sheetId="1" r:id="rId1"/></sheets></workbook>',
      'xl/_rels/workbook.xml.rels': '<Relationships xmlns="http:\u002f\u002fschemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http:\u002f\u002fschemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>',
      'xl/worksheets/sheet1.xml': '<worksheet xmlns="http:\u002f\u002fschemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>' + sheet + '</sheetData></worksheet>'
    };
    const crc = bytes => { let c = 0xffffffff; for (const b of bytes) { c ^= b; for (let k = 0; k < 8; k++)c = (c >>> 1) ^ ((c & 1) ? 0xedb88320 : 0); } return (c ^ 0xffffffff) >>> 0; };

      const directory = new Uint8Array(46 + name.length), d = new DataView(directory.buffer);
      d.setUint32(0, 0x02014b50, true); d.setUint16(4, 20, true); d.setUint16(6, 20, true); d.setUint16(14, 33, true); d.setUint32(16, checksum, true); d.setUint32(20, data.length, true); d.setUint32(24, data.length, true); d.setUint16(28, name.length, true); d.setUint32(42, offset, true); directory.set(name, 46); central.push(directory); offset += local.length;
    }
    const directorySize = central.reduce((n, p) => n + p.length, 0), end = new Uint8Array(22), e = new DataView(end.buffer);

    return new Blob([...locals, ...central, end], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

    const rows = [['BẢNG CHẤM CÔNG — VINTECH SOLUTIONS'], ['Kỳ', period, 'Công ghi nhận đến', appData.attendanceAsOf, '*: Lịch nghỉ dự kiến, chưa cộng công'], ['Mã NV', 'Họ và tên', 'Phòng ban', 'Chức danh', ...Array.from({ length: info.daysInMonth }, (_, i) => i + 1), 'Công X', 'Phép P', 'Ốm O', 'Không lương K', 'OT']];

  function renderDocsTable() {
    const tbody = document.getElementById('docs-tbody');
    if (!tbody) return;

    const searchKeyword = (document.getElementById('doc-search-input') ? document.getElementById('doc-search-input').value.trim().toLowerCase() : '');

    const filterCategory = (document.getElementById('doc-category-filter') ? document.getElementById('doc-category-filter').value : '');

    let docs = appData.documents || [];

    // Lọc theo từ khóa tìm kiếm (Số hiệu, Tiêu đề, Cơ quan, Lĩnh vực)
    if (searchKeyword) {
      docs = docs.filter(d =>
        (d.id && d.id.toLowerCase().includes(searchKeyword)) ||
        (d.title && d.title.toLowerCase().includes(searchKeyword)) ||
        (d.issuer && d.issuer.toLowerCase().includes(searchKeyword)) ||
        (d.category && d.category.toLowerCase().includes(searchKeyword))
      );
    }

    // Lọc theo loại văn bản (bao gồm nhóm Văn bản tiền lương)
    if (filterType && filterType !== 'all') {
      if (filterType === 'salary_docs') {
        docs = docs.filter(d =>
          (d.category && d.category.toLowerCase().includes('lương')) ||
          (d.title && d.title.toLowerCase().includes('lương')) ||
          (d.id && d.id.toLowerCase().includes('luong')) ||
          (d.type === 'Quy chế nội bộ' && d.title.toLowerCase().includes('lương'))

        docs = docs.filter(d => d.type === filterType);
      }

  // --- WORKFLOW ACTIONS ---
  function approveLeave(reqId) {
    const req = appData.leaveRequests.find(r => r.id === reqId);
    if (!req) return;

    const callerEmail = currentUser ? currentUser.email : '';
    callBackend('apiApproveLeave', [reqId, callerEmail], (res) => {
      if (res && res.success) {
        req.status = 'APPROVED';
        applyLeaveRangeToClientTimesheet(req.empId, req.from, req.to, req.days, req.type === 'Nghỉ phép năm' ? 'P' : 'K');
        showToast(res.message || `Đã duyệt đơn ${req.id} thành công!`, 'success');
        renderDashboard();
        renderLeaveTable();
        renderTimesheet();
      } else {
        showToast((res && res.message) || 'Phê duyệt đơn thất bại!', 'error');
      }
    }, (err) => {
      showToast('Lỗi máy chủ khi duyệt đơn: ' + err.message, 'error');
    });
  }

  function calculatePayroll() {
    if (currentUser.role !== 'hr') return;
    const targetPeriod = currentPayrollPeriod;
    if (!payrollPeriods.includes(targetPeriod)) return;
    if (!confirm(`Hệ thống sẽ tổng hợp số ngày công kỳ [${targetPeriod}] từ bảng Chấm Công và tính lại Lương thực lĩnh cho toàn bộ nhân sự rồi lưu vào Google Sheet. Tiếp tục?`)) return;
    showToast(`Đang tính lương kỳ ${targetPeriod} và đồng bộ Google Sheets...`, 'info');

    const callerEmail = currentUser ? currentUser.email : '';
    callBackend('apiCalculateMonthlyPayroll', [targetPeriod, callerEmail], (res) => {
      if (res && res.success) {
        showToast(res.message || `Đã tính toán và lưu Bảng Lương kỳ ${targetPeriod} vào Google Sheet thành công!`, 'success');
        if (res.payroll) {
          appData.payroll = res.payroll;
          renderPayrollTable();
        }
      } else {
        showToast((res && res.message) || 'Tính lương thất bại!', 'error');
      }
    }, (err) => {
      showToast('Lỗi máy chủ khi tính lương: ' + err.message, 'error');
    });
  }

  function handleCreateLeave(e) {
    e.preventDefault();
    const from = document.getElementById('leave-from').value;
    const to = document.getElementById('leave-to').value;
    const inputDays = parseInt(document.getElementById('leave-days').value, 10);
    const days = (Number.isFinite(inputDays) && inputDays > 0) ? inputDays : workingDayCount(from, to);
    const reason = document.getElementById('leave-reason').value;

    const newId = 'LV-' + Math.floor(1000 + Math.random() * 9000);
    const leaveObj = {
      id: newId,
      empId: currentUser.id,
      empName: currentUser.name,
      type: type,
      from: from,
      to: to,
      days: days,
      reason: reason,
      status: 'PENDING'
    };

    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn ? submitBtn.innerHTML : '';
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Đang gửi đơn...';
    }

    const callerEmail = currentUser ? currentUser.email : '';
    callBackend('apiSubmitLeave', [leaveObj, callerEmail], (res) => {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
      if (res && res.success) {
        if (res.newId) leaveObj.id = res.newId;
        appData.leaveRequests.unshift(leaveObj);
        closeModal('modal-leave');
        showToast(res.message || `Nộp đơn ${leaveObj.id} thành công!`, 'success');
        renderDashboard();
        renderLeaveTable();
        switchTab('leave');
      } else {
        showToast((res && res.message) || 'Lỗi nộp đơn nghỉ phép!', 'error');
      }
    }, (err) => {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
      showToast('Lỗi kết nối máy chủ: ' + err.message, 'error');
    });
  }

  let selectedSickFile = null;

  function handleSickFileSelected(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;

    if (file.size > 10 * 1024 * 1024) {
      showToast("Tệp tin quá lớn! Vui lòng chọn tệp nhỏ hơn 10MB.", "error");
      event.target.value = "";
      return;
    }

    selectedSickFile = file;
    const placeholder = document.getElementById('sick-file-placeholder');
    const preview = document.getElementById('sick-file-preview');
    const nameEl = document.getElementById('sick-file-name');
    const sizeEl = document.getElementById('sick-file-size');

    if (placeholder && preview && nameEl && sizeEl) {

  function handleCreateSick(e) {
    e.preventDefault();
    const hospital = document.getElementById('sick-hospital').value;
    const from = document.getElementById('sick-from').value;
    const to = document.getElementById('sick-to').value;

    const calcDays = workingDayCount(from, to);
    if (!calcDays) { showToast('Khoảng nghỉ phải có ngày làm việc hợp lệ.', 'error'); return; }
    if (!selectedSickFile) { showToast('Vui lòng chọn chứng từ.', 'error'); return; }

    const newId = 'SC-' + Math.floor(1000 + Math.random() * 9000);
    const sickObj = {
      id: newId,
      empId: currentUser.id,
      empName: currentUser.name,
      hospital: hospital,
      from: from,
      to: to,
      days: calcDays,
      status: 'PENDING'
    };

    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn ? submitBtn.innerHTML : '';
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up fa-bounce mr-2"></i>Đang tải lên Drive...';
    }

    const doSubmit = (fileData) => {
      if (fileData) sickObj.fileData = fileData;
      const callerEmail = currentUser ? currentUser.email : '';
      callBackend('apiSubmitSick', [sickObj, callerEmail], (res) => {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
        }
        if (res && res.success) {
          if (res.newId) sickObj.id = res.newId;
          if (res.docUrl) sickObj.docUrl = res.docUrl;
          appData.sickCases.unshift(sickObj);
          closeModal('modal-sick');
          clearSickFile();
          showToast(res.message || `Nộp hồ sơ ốm đau ${sickObj.id} (${calcDays} ngày) thành công!`, 'success');
          renderDashboard();
          renderSickTable();
          switchTab('sick');
        } else {
          showToast((res && res.message) || 'Lỗi nộp hồ sơ ốm đau!', 'error');
        }
      }, (err) => {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
        }
        showToast('Lỗi kết nối máy chủ: ' + err.message, 'error');
      });
    };

    if (selectedSickFile) {
      const reader = new FileReader();
      reader.onload = function (evt) {
        doSubmit({
          name: selectedSickFile.name,
          type: selectedSickFile.type,
          base64: evt.target.result
        });
      };
      reader.onerror = function () {
        showToast("Không thể đọc tệp tin cục bộ!", "error");
        doSubmit(null);
      };
      reader.readAsDataURL(selectedSickFile);
    } else {
      doSubmit(null);
    }
  }

  function money(value) { return (Number(value) || 0).toLocaleString('vi-VN') + ' đ'; }
  function safeUrl(value) { return /^https:\/\//i.test(value || '') ? escapeHtml(value) : '#'; }
  function isoDate(value) { return value && value.includes('/') ? value.split('/').reverse().join('-') : value || ''; }
  function setPeriodSelect(id, period) {
    const select = document.getElementById(id); if (!select) return;
    if (!Array.from(select.options).some(o => o.value === period)) select.add(new Option('Tháng ' + period, period));
    select.value = period;
  }
  function workingDayCount(from, to) {
    const start = new Date(from + 'T00:00:00Z'), end = new Date(to + 'T00:00:00Z');
    if (!Number.isFinite(start.getTime()) || !Number.isFinite(end.getTime()) || end < start || (end - start) / 86400000 > 365) return 0;
    let count = 0; for (let d = new Date(start); d <= end; d.setUTCDate(d.getUTCDate() + 1))if (![0, 6].includes(d.getUTCDay())) count++;
    return count > 0 ? count : (Math.round((end.getTime() - start.getTime()) / 86400000) + 1);
  }
  function refreshAppData() {
    if (!currentUser) return;
    const version = ++requestVersion, period = currentTimesheetPeriod;
    loadingData = true;
    callBackend('apiGetInitialAppData', [currentUser.email, period], res => {
      if (version !== requestVersion) return; loadingData = false;
      if (!res || !res.success) { showToast(res && res.message || 'Không tải được dữ liệu.', 'error'); return; }
      const data = res.data; USERS_DB = data.users;
      payrollPeriods = data.payrollPeriods || [];
      if (!payrollPeriods.includes(currentPayrollPeriod)) currentPayrollPeriod = data.defaultPayrollPeriod || '';
      appData = { attendanceCutoff: data.attendanceCutoff, attendanceAsOf: data.attendanceAsOf, plannedTimesheet: data.plannedTimesheet || {}, timesheet: data.timesheet, timesheetByPeriod: { [period]: data.timesheet }, leaveRequests: data.leaves, sickCases: data.sickCases, payroll: data.payroll, tasks: data.tasks, documents: data.documents };
      document.getElementById('sync-status').classList.remove('hidden');
      initApp(); populateAssigneeSelect(); applyRoleControls();
    }, err => { loadingData = false; showToast(err.message, 'error'); });
  }
  function applyRoleControls() {
    if (!currentUser) return;
    const manager = currentUser.role === 'manager';
    document.getElementById('nav-leave-label').innerText = manager ? 'Duyệt Nghỉ Phép' : 'Nghỉ Phép Của Tôi';
    document.getElementById('nav-sick-label').innerText = manager ? 'Duyệt Hồ Sơ Ốm' : 'Hồ Sơ Ốm Của Tôi';
    document.getElementById('nav-tasks-label').innerText = manager ? 'Quản Lý Công Việc' : 'Công Việc Của Tôi';
    document.querySelectorAll('[data-manager-only]').forEach(el => el.classList.toggle('hidden', currentUser.role !== 'manager'));
    document.querySelectorAll('[data-document-create]').forEach(el => el.classList.toggle('hidden', currentUser.role === 'employee'));
    document.querySelectorAll('[data-edit-doc]').forEach(el => {
      const doc = appData.documents.find(d => d.id === el.dataset.editDoc);
      el.classList.toggle('hidden', !doc || !canManageDocument(doc.type));
    });
    document.querySelectorAll('[data-attachment-kind]').forEach(el => el.onclick = () => viewAttachment(el.dataset.attachmentKind, el.dataset.attachmentId, el.dataset.download === 'true'));
  }
  function viewAttachment(kind, id, download) {
    const tab = download ? null : window.open('about:blank', '_blank');
    callBackend('apiReadAttachment', [kind, id], res => {
      if (!res || !res.success) { if (tab) tab.close(); showToast(res && res.message || 'Không mở được tài liệu.', 'error'); return; }
      if (res.url) { if (tab) tab.location.href = res.url; else window.open(res.url, '_blank', 'noopener'); return; }
      const bytes = Uint8Array.from(atob(res.content), c => c.charCodeAt(0));
      const url = URL.createObjectURL(new Blob([bytes], { type: res.mimeType }));
      if (tab) tab.location.href = url;
      else { const a = document.createElement('a'); a.href = url; a.download = res.fileName; document.body.appendChild(a); a.click(); a.remove(); }
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }, err => { if (tab) tab.close(); showToast(err.message, 'error'); });
  }
  document.addEventListener('click', event => {
    const edit = event.target.closest('[data-edit-doc]'), assign = event.target.closest('[data-assign-doc]');
    if (edit) editDoc(edit.dataset.editDoc);
    if (assign) assignTaskFromDoc(assign.dataset.assignDoc);
    const target = event.target.closest('[data-attachment-kind]');
    if (target && !target.onclick) viewAttachment(target.dataset.attachmentKind, target.dataset.attachmentId, target.dataset.download === 'true');
  });
  ['leave-from', 'leave-to'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('change', () => {
        const target = document.getElementById('leave-days');
        if (target) target.value = workingDayCount(document.getElementById('leave-from').value, document.getElementById('leave-to').value);
      });
    }
  });

  // Tự động gắn sự kiện submit trực tiếp vào form đăng nhập
  function bindLoginForm() {
    const form = document.getElementById('login-form') || document.querySelector('#screen-login form');
    if (form && !form.__bound) {
      form.__bound = true;
      form.addEventListener('submit', handleLoginSubmit);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bindLoginForm);
  } else {
    bindLoginForm();
  }
  console.log('VinTech Solutions - Client scripts loaded.');
</script>
