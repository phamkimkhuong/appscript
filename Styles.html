<style>
  /* Documents keep readable column widths; only long titles wrap. */
  .docs-table-card { min-width: 0; max-width: 100%; }
  .docs-table-scroll {
    width: 100%; max-height: 65vh; overflow: auto;
    scrollbar-width: auto; scrollbar-color: #94a3b8 #f1f5f9;
  }
  .docs-table-scroll:focus-visible { outline: 2px solid #2563eb; outline-offset: -2px; }
  .docs-table-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
  .docs-table { width: 100%; min-width: 110rem; border-collapse: separate; border-spacing: 0; }
  .docs-table th, .docs-table td { white-space: nowrap; vertical-align: middle; }
  .docs-table thead th { position: sticky; top: 0; z-index: 2; background: #f1f5f9; }
  .docs-table tbody td { background: #fff; border-bottom: 1px solid #f1f5f9; }
  .docs-table tbody tr:hover td { background: #f8fafc; }
  .docs-table tbody tr:last-child td { border-bottom: 0; }
  .docs-table .doc-title { width: 22rem; white-space: normal; overflow-wrap: anywhere; line-height: 1.5; }
  .docs-table td > span { display: inline-flex; align-items: center; }
  .docs-table button { white-space: nowrap; flex-shrink: 0; }
  .docs-file-actions { display: inline-flex; align-items: center; gap: 0.75rem; }
  @media (min-width: 768px) {
    .docs-table th:first-child, .docs-table td:first-child:not([colspan]) {
      position: sticky; left: 0; z-index: 1; min-width: 11rem;
      box-shadow: 1px 0 0 #e2e8f0;
    }
    .docs-table thead th:first-child { z-index: 3; }
  }
  @media (min-width: 1024px) {
    .docs-table th:last-child, .docs-table td:last-child:not([colspan]) {
      position: sticky; right: 0; z-index: 1; min-width: 11rem;
      box-shadow: -1px 0 0 #e2e8f0;
    }
    .docs-table thead th:last-child { z-index: 3; }
  }
</style>

<style>
  .sick-table-scroll { max-width: 100%; overflow-x: auto; }
  .sick-table-scroll:focus-visible { outline: 2px solid #2563eb; outline-offset: -2px; }
  .sick-table-scroll::-webkit-scrollbar { height: 10px; }
  #pane-sick .sick-table { min-width: 96rem; }
  .sick-table th, .sick-table td { vertical-align: middle; }
  .sick-table th,
  .sick-table td:nth-child(1), .sick-table td:nth-child(4),
  .sick-table td:nth-child(5), .sick-table td:nth-child(6),
  .sick-table td:nth-child(7), .sick-table td:nth-child(9) { white-space: nowrap; }
  .sick-table th:nth-child(2), .sick-table th:nth-child(3) { min-width: 10rem; }
  .sick-table td:nth-child(7) > span { display: inline-flex; align-items: center; }
  .sick-table th:last-child, .sick-table td:last-child { width: 18rem; min-width: 18rem; }
  .sick-note { width: 16rem; white-space: normal; overflow-wrap: anywhere; line-height: 1.5; }
  .sick-review-actions { display: flex; justify-content: flex-end; align-items: center; gap: 0.375rem; flex-wrap: nowrap; }
  .sick-review-button {
    display: inline-flex; justify-content: center; align-items: center;
    box-sizing: border-box; flex: 0 0 5rem; width: 5rem; height: 2.25rem;
    padding: 0 0.5rem; white-space: nowrap; line-height: 1;
  }
  .sick-resubmit-button { min-width: 9rem; height: 2.25rem; justify-content: center; white-space: nowrap; flex-shrink: 0; }
</style>
