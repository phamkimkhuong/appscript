<style>
  /**
   * ====================================================================
   * WANZHONG CLEAN TECHNOLOGY (VIETNAM) - ENTERPRISE HRM & E-OFFICE
   * ====================================================================
   * FILE: Styles.html
   * VAI TRÒ: BẢNG ĐỊNH KIỂU & HỆ THỐNG THIẾT KẾ GIAO DIỆN (CSS DESIGN SYSTEM)
   * --------------------------------------------------------------------
   * MÔ TẢ THÀNH PHẦN:
   * 1. Font chữ & Thanh cuộn tùy chỉnh (Typography & Scrollbar):
   *    - Áp dụng font chuẩn Google Inter, thanh cuộn mini-scrollbar thẩm mỹ.
   *
   * 2. Bảng định kiểu Nút bấm & Thẻ trạng thái (Badges & Components):
   *    - Các lớp định dạng nút điều hướng Sidebar (nav-item active/hover).
   *    - Badge trạng thái Chấm công, Phép, Hồ sơ ốm đau, Trạng thái văn bản.
   *
   * 3. Hiệu ứng chuyển động mượt mà (Transitions & Animations):
   *    - Toast thông báo, Backdrop blur, Modal popup, Dropdown menu.
   *
   * 4. Tối ưu In ấn Phiếu lương (Print Media Query):
   *    - Ẩn toàn bộ thanh điều hướng, nút bấm khi in; căn lề chuẩn khổ giấy A4/A5.
   * ====================================================================
   */
  body {
    font-family: 'Inter', sans-serif;
  }

  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }

  ::-webkit-scrollbar-track {
    background: #f1f5f9;
  }

  ::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 3px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }

  .matrix-cell {
    min-width: 28px;
    max-width: 28px;
    height: 32px;
    font-size: 11px;
    padding: 0;
  }

  .cell-x {
    background-color: #f1f5f9;
    color: #334155;
    font-weight: 600;
  }

  .cell-p {
    background-color: #dbeafe;
    color: #1d4ed8;
    font-weight: 700;
  }

  .cell-o {
    background-color: #ffedd5;
    color: #c2410c;
    font-weight: 700;
  }

  .cell-ot {
    background-color: #f3e8ff;
    color: #6b21a8;
    font-weight: 800;
  }

  .cell-l {
    background-color: #f3e8ff;
    color: #7e22ce;
    font-weight: 700;
  }

  .cell-cn {
    background-color: #fee2e2;
    color: #b91c1c;
    font-weight: 600;
  }

  /* Chế độ Chỉnh Sửa Chấm Công (Timesheet Edit Mode) */
  .matrix-cell-editable {
    cursor: pointer !important;
    position: relative;
    transition: background-color 0.1s ease, box-shadow 0.1s ease, transform 0.1s ease;
  }
  .matrix-cell-editable:hover {
    box-shadow: inset 0 0 0 2px #2563eb !important;
    z-index: 5;
    background-color: #eff6ff !important;
  }
  .matrix-cell-draft {
    box-shadow: inset 0 0 0 2px #f59e0b !important;
    position: relative;
    font-weight: 800 !important;
    background-color: #fef3c7 !important;
  }
  .matrix-cell-draft::after {
    content: '';
    position: absolute;
    top: 2px;
    right: 2px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: #d97706;
    box-shadow: 0 0 4px rgba(217, 119, 6, 0.6);
  }
  #timesheet-popover {
    animation: popoverFadeIn 0.15s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes popoverFadeIn {
    from { opacity: 0; transform: scale(0.95) translateY(-4px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
</style>

<style>
.tab-pane > div:has(> table) { overflow-x:auto; }
.cell-k { background:#ffe4e6;color:#9f1239; }
[id^="modal-"] > div { max-height:92vh;overflow-y:auto; }
button:disabled{opacity:.45;cursor:not-allowed;}

/* Mobile Optimization & Responsive Utilities */
.no-scrollbar {
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.no-scrollbar::-webkit-scrollbar {
  display: none;
}

.overflow-x-auto, .docs-table-scroll, .sick-table-scroll {
  -webkit-overflow-scrolling: touch;
}

@media(max-width:768px){
  /* Thu gọn trạng thái Google Sheets Live chỉ còn chấm tròn xanh trên điện thoại, tránh tràn ngang */
  #sync-status span[data-i18n="sync_live"] { display: none !important; }
  #sync-status { padding: 4px 6px !important; min-width: 0 !important; }
  /* Giới hạn bộ chọn ngôn ngữ vừa vặn màn hình điện thoại */
  #app-lang-select { max-width: 72px; }
}

@media(max-width:640px){
  .tab-pane table { min-width: 680px; }
  #timesheet-table { min-width: 1050px; }
  #pane-payroll > div:first-child { flex-wrap: wrap; gap: 10px; }
  /* Tối ưu Safari iOS: không tự động phóng to (auto-zoom) khi chạm vào ô nhập liệu */
  input:not([type="checkbox"]):not([type="radio"]),
  select,
  textarea {
    font-size: 16px !important;
  }
  /* Căn lề khung thoại Modal toàn màn hình điện thoại */
  [id^="modal-"] {
    padding: 0.5rem !important;
  }
  [id^="modal-"] > div {
    max-height: 92vh;
    border-radius: 1rem;
    width: 100% !important;
    margin: auto;
  }
}
</style>

<style>
  /* Documents keep readable column widths; only long titles wrap. */
  .docs-table-card { min-width: 0; max-width: 100%; }
  .docs-table-scroll {
    width: 100%; max-height: 65vh; overflow: auto;
    scrollbar-width: auto; scrollbar-color: #94a3b8 #f1f5f9;
  }
  .docs-table-scroll:focus-visible { outline: 2px solid #2563eb; outline-offset: -2px; }
  .docs-table-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
  .docs-table { width: 100%; min-width: 110rem; border-collapse: separate; border-spacing: 0; }
  .docs-table th, .docs-table td { white-space: nowrap; vertical-align: middle; }
  .docs-table thead th { position: sticky; top: 0; z-index: 2; background: #f1f5f9; }
  .docs-table tbody td { background: #fff; border-bottom: 1px solid #f1f5f9; }
  .docs-table tbody tr:hover td { background: #f8fafc; }
  .docs-table tbody tr:last-child td { border-bottom: 0; }
  .docs-table .doc-title { width: 22rem; white-space: normal; overflow-wrap: anywhere; line-height: 1.5; }
  .docs-table td > span { display: inline-flex; align-items: center; }
  .docs-table button { white-space: nowrap; flex-shrink: 0; }
  .docs-file-actions { display: inline-flex; align-items: center; gap: 0.75rem; }
  @media (min-width: 768px) {
    .docs-table th:first-child, .docs-table td:first-child:not([colspan]) {
      position: sticky; left: 0; z-index: 1; min-width: 11rem;
      box-shadow: 1px 0 0 #e2e8f0;
    }
    .docs-table thead th:first-child { z-index: 3; }
  }
  @media (min-width: 1024px) {
    .docs-table th:last-child, .docs-table td:last-child:not([colspan]) {
      position: sticky; right: 0; z-index: 1; min-width: 11rem;
      box-shadow: -1px 0 0 #e2e8f0;
    }
    .docs-table thead th:last-child { z-index: 3; }
  }
</style>

<style>
  .sick-table-scroll { max-width: 100%; overflow-x: auto; }
  .sick-table-scroll:focus-visible { outline: 2px solid #2563eb; outline-offset: -2px; }
  .sick-table-scroll::-webkit-scrollbar { height: 10px; }
  #pane-sick .sick-table { min-width: 96rem; }
  .sick-table th, .sick-table td { vertical-align: middle; }
  .sick-table th,
  .sick-table td:nth-child(1), .sick-table td:nth-child(4),
  .sick-table td:nth-child(5), .sick-table td:nth-child(6),
  .sick-table td:nth-child(7), .sick-table td:nth-child(9) { white-space: nowrap; }
  .sick-table th:nth-child(2), .sick-table th:nth-child(3) { min-width: 10rem; }
  .sick-table td:nth-child(7) > span { display: inline-flex; align-items: center; }
  .sick-table th:last-child, .sick-table td:last-child { width: 18rem; min-width: 18rem; }
  .sick-note { width: 16rem; white-space: normal; overflow-wrap: anywhere; line-height: 1.5; }
  .sick-review-actions { display: flex; justify-content: flex-end; align-items: center; gap: 0.375rem; flex-wrap: nowrap; }
  .sick-review-button {
    display: inline-flex; justify-content: center; align-items: center;
    box-sizing: border-box; flex: 0 0 5rem; width: 5rem; height: 2.25rem;
    padding: 0 0.5rem; white-space: nowrap; line-height: 1;
  }
  .sick-resubmit-button { min-width: 9rem; height: 2.25rem; justify-content: center; white-space: nowrap; flex-shrink: 0; }
</style>
